<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIGA — Sistema Integrado de Gestão Aceitar</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%231a3a5c'/%3E%3Ctext x='50' y='62' font-family='Segoe UI,sans-serif' font-size='36' font-weight='700' text-anchor='middle' fill='%23c9a24a'%3EA%3C/text%3E%3C/svg%3E">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"/>
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"/>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <style>
    :root {
      --navy: #1a3a5c;
      --navy-light: #234969;
      --navy-dark: #0f2642;
      --gold: #c9a24a;
      --gold-light: #e0bc6b;
      --gold-dark: #a88236;
      --bg: #f7f2e8;
      --bg-muted: #efe8d8;
      --card-bg: #ffffff;
      --border: #d9d0bd;
      --border-light: #e8e0cc;
      --text: #2a2a2a;
      --text-muted: #6b6b6b;
      --text-soft: #8a8a8a;
      --success: #2e7d4a;
      --success-bg: #e8f5ec;
      --warning: #d97706;
      --warning-bg: #fef3e2;
      --danger: #b91c1c;
      --danger-bg: #fdecec;
      --info: #2563eb;
      --info-bg: #e8efff;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
      --shadow: 0 2px 8px rgba(0,0,0,0.06);
      --shadow-lg: 0 8px 24px rgba(0,0,0,0.1);
      --radius: 6px;
      --radius-lg: 10px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, system-ui, sans-serif;
      font-size: 14px;
      color: var(--text);
      background: var(--bg);
      line-height: 1.5;
      min-height: 100vh;
    }

    button { font-family: inherit; cursor: pointer; }
    input, select, textarea { font-family: inherit; font-size: 14px; }
    a { color: inherit; text-decoration: none; }

    /* ========== LOGIN ========== */
    #login-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--navy) 0%, var(--navy-dark) 100%);
    }
    .login-card {
      background: var(--card-bg);
      padding: 40px;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      width: 100%;
      max-width: 420px;
    }
    .login-logo {
      text-align: center;
      margin-bottom: 28px;
    }
    .login-logo h1 {
      font-size: 32px;
      font-weight: 700;
      color: var(--navy);
      letter-spacing: 2px;
    }
    .login-logo .tagline {
      color: var(--text-muted);
      font-size: 12px;
      margin-top: 4px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .login-logo .accent {
      width: 40px;
      height: 3px;
      background: var(--gold);
      margin: 12px auto;
    }

    /* ========== FORMS ========== */
    .form-group {
      margin-bottom: 16px;
    }
    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    .form-group label .required { color: var(--danger); }
    .form-control {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--card-bg);
      color: var(--text);
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .form-control:focus {
      outline: none;
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(201, 162, 74, 0.15);
    }
    textarea.form-control { resize: vertical; min-height: 80px; }
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .form-row-3 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 16px;
    }
    @media (max-width: 700px) {
      .form-row, .form-row-3 { grid-template-columns: 1fr; }
    }

    /* ========== BUTTONS ========== */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 9px 16px;
      border: 1px solid transparent;
      border-radius: var(--radius);
      font-size: 13px;
      font-weight: 600;
      transition: all 0.15s;
      white-space: nowrap;
      text-decoration: none;
    }
    .btn-primary {
      background: var(--navy);
      color: white;
      border-color: var(--navy);
    }
    .btn-primary:hover { background: var(--navy-light); }
    .btn-gold {
      background: var(--gold);
      color: white;
      border-color: var(--gold);
    }
    .btn-gold:hover { background: var(--gold-dark); }
    .btn-secondary {
      background: var(--card-bg);
      color: var(--text);
      border-color: var(--border);
    }
    .btn-secondary:hover { background: var(--bg-muted); }
    .btn-danger {
      background: var(--danger);
      color: white;
      border-color: var(--danger);
    }
    .btn-danger:hover { background: #8b1616; }
    .btn-ghost {
      background: transparent;
      color: var(--text-muted);
      padding: 6px 10px;
    }
    .btn-ghost:hover { color: var(--text); background: var(--bg-muted); }
    .btn-sm { padding: 5px 10px; font-size: 12px; }
    .btn-lg { padding: 12px 20px; font-size: 14px; }
    .btn-block { width: 100%; justify-content: center; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ========== APP SHELL ========== */
    #app { display: none; }
    #app.active { display: block; }

    /* Navbar */
    .navbar {
      background: var(--navy);
      color: white;
      border-bottom: 3px solid var(--gold);
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: var(--shadow);
    }
    .navbar-inner {
      max-width: 1600px;
      margin: 0 auto;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 56px;
    }
    .navbar-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 18px;
      letter-spacing: 1.5px;
    }
    .navbar-brand .dot {
      color: var(--gold);
      font-size: 22px;
      line-height: 0;
    }
    .navbar-brand .brand-meta {
      display: flex;
      flex-direction: column;
      gap: 1px;
      line-height: 1.1;
    }
    .navbar-brand .subtitle {
      font-size: 10px;
      font-weight: 400;
      color: rgba(255,255,255,0.7);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .navbar-links {
      display: flex;
      gap: 2px;
    }
    .nav-link {
      padding: 8px 14px;
      border-radius: var(--radius);
      color: rgba(255,255,255,0.85);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
      border: none;
      background: transparent;
    }
    .nav-link:hover {
      background: var(--navy-light);
      color: white;
    }
    .nav-link.active {
      background: var(--gold);
      color: var(--navy-dark);
      font-weight: 600;
    }
    .navbar-user {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 12px;
    }
    .user-badge {
      padding: 3px 8px;
      border-radius: 10px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    .user-badge.superadmin { background: var(--gold); color: var(--navy-dark); }
    .user-badge.editor { background: #c9a24a; color: var(--navy-dark); }
    .user-badge.leitor { background: rgba(255,255,255,0.15); color: white; }
    .app-version {
      font-size: 10px;
      color: var(--gold-light);
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.3px;
      font-weight: 600;
    }
    .btn-outline {
      background: transparent;
      color: rgba(255,255,255,0.9);
      border: 1px solid rgba(255,255,255,0.3);
    }
    .btn-outline:hover {
      background: rgba(255,255,255,0.1);
      border-color: rgba(255,255,255,0.5);
    }

    /* Main content */
    .main {
      max-width: 1600px;
      margin: 0 auto;
      padding: 24px;
    }

    /* Page header */
    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 12px;
    }
    .page-title {
      font-size: 22px;
      font-weight: 700;
      color: var(--navy);
    }
    .page-subtitle {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .page-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    /* ========== CARDS / KPIs ========== */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .kpi-card {
      background: var(--card-bg);
      padding: 18px 20px;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-light);
      box-shadow: var(--shadow-sm);
    }
    .kpi-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      font-weight: 600;
      margin-bottom: 8px;
    }
    .kpi-value {
      font-size: 26px;
      font-weight: 700;
      color: var(--navy);
    }
    .kpi-sub {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* ========== CARD SECTION ========== */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
    }
    .card-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border-light);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .card-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--navy);
    }
    .card-body { padding: 20px; }

    /* Title h4 directly inside a card (analise blocks) */
    .card > h4 {
      margin: 0;
      padding: 18px 20px 14px;
      text-align: center;
      font-size: 14px;
      font-weight: 600;
      color: var(--navy);
      letter-spacing: 0.2px;
      border-bottom: 1px solid var(--border-light);
    }
    /* Spacing for canvas / table directly after card h4 */
    .card > h4 + div,
    .card > h4 + canvas,
    .card > h4 + .table-wrapper {
      padding: 16px 20px;
    }
    .card > h4 + .table-wrapper {
      padding: 0; /* tabela usa o seu próprio padding nas células */
    }

    /* Variante de tabela para análise: tudo centrado e 1ª coluna identada */
    .data-table.analytics thead th {
      text-align: center;
      cursor: default;
    }
    .data-table.analytics thead th:hover { background: var(--bg-muted); }
    .data-table.analytics tbody td {
      text-align: center;
    }
    .data-table.analytics tbody td:first-child,
    .data-table.analytics thead th:first-child {
      text-align: left;
      padding-left: 24px;
    }

    /* ========== FILTER BAR ========== */
    .filter-bar {
      display: flex;
      gap: 10px;
      padding: 12px 20px;
      background: var(--bg-muted);
      border-bottom: 1px solid var(--border-light);
      flex-wrap: wrap;
      align-items: center;
    }
    .filter-bar .form-control {
      max-width: 220px;
      min-width: 140px;
    }
    .filter-bar .search {
      flex: 1;
      min-width: 200px;
      max-width: 340px;
    }

    /* ========== TABLE ========== */
    .table-wrapper {
      overflow-x: auto;
    }
    table.data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    .data-table thead th {
      text-align: left;
      padding: 10px 14px;
      background: var(--bg-muted);
      color: var(--navy);
      font-weight: 600;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      border-bottom: 2px solid var(--border);
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }
    .data-table thead th:hover { background: var(--border-light); }
    .data-table thead th.sort-asc::after { content: " ▲"; color: var(--gold); }
    .data-table thead th.sort-desc::after { content: " ▼"; color: var(--gold); }
    .data-table tbody td {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border-light);
      vertical-align: middle;
    }
    .data-table tbody tr:hover { background: var(--bg); }
    .data-table tbody tr.clickable { cursor: pointer; }
    .data-table .actions {
      display: flex;
      gap: 4px;
      justify-content: flex-end;
    }
    .data-table .empty-row td {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
      font-style: italic;
    }
    .num { text-align: right; font-variant-numeric: tabular-nums; }
    .cen { text-align: center; }

    /* Cabeçalhos da listagem com ordenação: sempre centrados e bold */
    .data-table.sortable-listing thead th {
      text-align: center;
      font-weight: 700;
    }
    .data-table.sortable-listing thead th.sortable { cursor: pointer; }
    .data-table.sortable-listing thead th.sortable:hover { background: var(--border-light); }

    /* ========== STATUS BADGES ========== */
    .badge {
      display: inline-block;
      padding: 3px 9px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      white-space: nowrap;
    }
    .badge-pendente { background: #fef3c7; color: #92400e; }
    .badge-emaberto { background: #e0f2fe; color: #075985; }
    .badge-preparacao { background: #dbeafe; color: #1e40af; }
    .badge-submetido { background: #e0e7ff; color: #3730a3; }
    .badge-enviada { background: #e0e7ff; color: #3730a3; }
    .badge-adjudicado,
    .badge-adjudicada { background: var(--success-bg); color: var(--success); }
    .badge-aceite { background: var(--success-bg); color: var(--success); }
    .badge-naoadjudicado,
    .badge-naoadjudicada { background: var(--danger-bg); color: var(--danger); }
    .badge-rejeitada { background: var(--danger-bg); color: var(--danger); }
    .badge-execucao { background: #fff3e0; color: #b85c00; }
    .badge-realizada { background: #fff3e0; color: #b85c00; }
    .badge-agendada { background: #fde68a; color: #92400e; }
    .badge-comrelatorio { background: #ede9fe; color: #5b21b6; }
    .badge-concluida { background: #e8f5ec; color: var(--success); }
    .badge-fechada { background: #d1fae5; color: #065f46; }
    .badge-cancelada,
    .badge-cancelado { background: #f1f5f9; color: #475569; }
    .badge-aprovado { background: #dbeafe; color: #1e40af; }
    .badge-naoaprovado { background: var(--danger-bg); color: var(--danger); }
    .badge-aguardaresultado { background: #fef3c7; color: #92400e; }
    .badge-aguardaconfirmacao { background: #fde68a; color: #92400e; }
    .badge-ganho { background: var(--success-bg); color: var(--success); }
    .badge-perdido { background: var(--danger-bg); color: var(--danger); }
    .badge-eliminados { background: #f1f5f9; color: #475569; }

    /* Workflow stepper */
    .workflow-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      padding: 12px 16px;
      background: var(--bg-muted);
      border-radius: var(--radius);
      margin-bottom: 16px;
    }
    .workflow-step {
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
      background: white;
      color: var(--text-soft);
      border: 1px solid var(--border-light);
      white-space: nowrap;
    }
    .workflow-step.active {
      background: var(--gold);
      color: var(--navy-dark);
      border-color: var(--gold);
    }
    .workflow-step.done {
      background: var(--success);
      color: white;
      border-color: var(--success);
    }
    .workflow-step.cancelled {
      background: var(--danger);
      color: white;
      border-color: var(--danger);
    }
    .workflow-arrow { color: var(--text-soft); font-size: 12px; }
    .workflow-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    /* Anexos */
    .anexo-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border: 1px solid var(--border-light);
      border-radius: var(--radius);
      margin-bottom: 6px;
      background: white;
    }
    .anexo-item.relatorio {
      background: linear-gradient(90deg, #faf6ed, white);
      border-color: var(--gold-light);
    }
    .anexo-icon { font-size: 20px; }
    .anexo-info { flex: 1; min-width: 0; }
    .anexo-nome { font-weight: 600; font-size: 13px; word-break: break-all; }
    .anexo-meta { font-size: 11px; color: var(--text-muted); }
    .anexo-actions { display: flex; gap: 4px; }

    /* ========== MODALS ========== */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 38, 66, 0.6);
      z-index: 200;
      padding: 24px;
      overflow-y: auto;
    }
    .modal-overlay.active {
      display: flex;
      align-items: flex-start;
      justify-content: center;
    }
    .modal {
      background: var(--card-bg);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      width: 100%;
      max-width: 720px;
      max-height: calc(100vh - 48px);
      overflow-y: auto;
      margin: auto;
    }
    .modal.modal-sm { max-width: 440px; }
    .modal.modal-lg { max-width: 960px; }
    .modal-header {
      padding: 18px 24px;
      border-bottom: 1px solid var(--border-light);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .modal-title {
      font-size: 17px;
      font-weight: 700;
      color: var(--navy);
    }
    .modal-close {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 22px;
      cursor: pointer;
      padding: 0 4px;
      line-height: 1;
    }
    .modal-close:hover { color: var(--text); }
    .modal-body { padding: 24px; }
    .modal-footer {
      padding: 16px 24px;
      border-top: 1px solid var(--border-light);
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      background: var(--bg-muted);
    }

    /* ========== UTILS ========== */
    .flex { display: flex; }
    .gap-sm { gap: 8px; }
    .gap { gap: 16px; }
    .items-center { align-items: center; }
    .justify-between { justify-content: space-between; }
    .flex-wrap { flex-wrap: wrap; }
    .mt-sm { margin-top: 8px; }
    .mt { margin-top: 16px; }
    .mb-sm { margin-bottom: 8px; }
    .mb { margin-bottom: 16px; }
    .mb-lg { margin-bottom: 24px; }
    .hidden { display: none !important; }
    .text-muted { color: var(--text-muted); }
    .text-small { font-size: 12px; }
    .text-center { text-align: center; }

    /* Toast */
    #toast-container {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .toast {
      background: var(--navy);
      color: white;
      padding: 12px 16px;
      border-radius: var(--radius);
      box-shadow: var(--shadow-lg);
      font-size: 13px;
      min-width: 240px;
      max-width: 400px;
      animation: slide-in 0.2s;
    }
    .toast.success { background: var(--success); }
    .toast.error { background: var(--danger); }
    @keyframes slide-in {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }

    /* Analysis IA panel */
    .ia-panel {
      background: linear-gradient(135deg, #faf6ed 0%, #f5efdd 100%);
      border: 1px solid var(--gold-light);
      border-radius: var(--radius-lg);
      padding: 20px;
    }
    .ia-panel h4 {
      color: var(--navy);
      font-size: 14px;

const GITHUB_REPO = 'CarSanFer/siga-aceitar';

// Mapeia nome do ficheiro → path no repositório
function pathForFile(name) {
  // Remove sufixos do tipo " (1)", " (2)" que o browser adiciona em downloads repetidos
  // Ex: "index (3).html" → "index.html", "vercel (1).json" → "vercel.json"
  let clean = name.replace(/\s*\(\d+\)(?=\.[^.]+$)/, '');
  // Ficheiros que vão para subpastas
  if (clean === 'analisar.js') return 'api/analisar.js';
  if (clean.endsWith('.sql')) return 'migrations/' + clean;
  // Resto fica na raiz
  return clean;
}

async function deployToGitHub(input) {
  const file = input.files[0];
  if (!file) return;
  const targetPath = pathForFile(file.name);

  // Proteção: alertar se vai sobrescrever index.html com ficheiro não-HTML
  const text = await file.text();
  if (targetPath === 'index.html' && !text.trim().toLowerCase().startsWith('<!doctype html')) {
    if (!confirm('⚠️ Este ficheiro não parece ser HTML mas vai ser enviado para index.html.\n\nIsto pode partir o site. Continuar?')) {
      input.value = '';
      return;
    }
  }

  const btn = document.getElementById('btn-deploy');
  const origText = btn.innerHTML;
  btn.innerHTML = '⏳ ' + targetPath + '...';
  btn.style.pointerEvents = 'none';
  let token = localStorage.getItem('gh_token');
  if (!token) {
    token = prompt('GitHub Personal Access Token (scope: repo):');
    if (!token) { btn.innerHTML = origText; btn.style.pointerEvents = ''; return; }
    localStorage.setItem('gh_token', token.trim());
  }
  try {
    const bytes = new TextEncoder().encode(text);
    let binary = '';
    const chunkSize = 8192;
    for (let i = 0; i < bytes.length; i += chunkSize) {
      binary += String.fromCharCode(...bytes.subarray(i, i + chunkSize));
    }
    const encoded = btoa(binary);
    const getResp = await fetch(`https://api.github.com/repos/${GITHUB_REPO}/contents/${targetPath}`, {
      headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/vnd.github+json' }
    });
    const existing = getResp.ok ? await getResp.json() : null;
    const sha = existing?.sha;
    const putResp = await fetch(`https://api.github.com/repos/${GITHUB_REPO}/contents/${targetPath}`, {
      method: 'PUT',
      headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json' },
      body: JSON.stringify({
        message: `Deploy ${targetPath} — ${new Date().toLocaleString('pt-PT')}`,
        content: encoded,
        ...(sha ? { sha } : {})
      })
    });
    if (!putResp.ok) {
      const err = await putResp.json();
      throw new Error(err.message || 'Erro no deploy');
    }
    btn.innerHTML = '✅ ' + targetPath;
    setTimeout(() => { btn.innerHTML = origText; btn.style.pointerEvents = ''; }, 3000);
  } catch (e) {
    alert('Erro no deploy: ' + e.message);
    localStorage.removeItem('gh_token');
    btn.innerHTML = origText;
    btn.style.pointerEvents = '';
  }
}

// ---------- UTILS ----------
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function fmtCurrency(v) {
  if (v === null || v === undefined || v === '') return '—';
  const n = Number(v);
  if (isNaN(n)) return '—';
  // Formato: 1 000,00 € (separador de milhar com espaço, decimal com vírgula)
  const fixed = n.toFixed(2);
  const [intPart, decPart] = fixed.split('.');
  const intWithSpaces = intPart.replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
  return intWithSpaces + ',' + decPart + ' €';
}

// Inteiros / quilómetros / qualquer valor com separador de milhares ' '
function fmtNumber(v, withSign) {
  if (v === null || v === undefined || v === '') return '—';
  const n = Math.round(Number(v));
  if (isNaN(n)) return '—';
  const sign = (withSign && n > 0) ? '+' : (n < 0 ? '-' : '');
  const intWithSpaces = Math.abs(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
  return sign + intWithSpaces;
}

// ===== Padrão numérico global (inputs editáveis) =====
// Parser tolerante pt-PT: "1 234,56" -> 1234.56
function parseNumPT(s) {
  if (s === null || s === undefined) return NaN;
  const clean = String(s).replace(/[\s\u00A0]/g, '').replace(',', '.');
  return clean === '' ? NaN : parseFloat(clean);
}

// Formata para input: espaço como separador de milhares, vírgula decimal.
// decimals = mínimo de casas (preserva mais se existirem, ex: taxas ao km)
function fmtInputNumber(v, decimals) {
  if (v === null || v === undefined || v === '') return '';
  const n = Number(v);
  if (isNaN(n)) return '';
  const actualDec = (String(v).split('.')[1] || '').length;
  const d = Math.max(decimals || 0, Math.min(actualDec, 6));
  const fixed = Math.abs(n).toFixed(d);
  const [i, dec] = fixed.split('.');
  const int = i.replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
  return (n < 0 ? '-' : '') + int + (dec ? ',' + dec : '');
}

// onblur dos inputs numéricos: normaliza para o formato padrão
function numInputBlur(el) {
  const n = parseNumPT(el.value);
  el.value = isNaN(n) ? '' : fmtInputNumber(n, parseInt(el.dataset.decimals || '0', 10));
  if (el.oninput) el.oninput();
}

function fmtDate(v) {
  if (!v) return '—';
  const d = new Date(v);
  if (isNaN(d.getTime())) return '—';
  return d.toLocaleDateString('pt-PT');
}

function fmtDateTime(v) {
  if (!v) return '—';
  const d = new Date(v);
  if (isNaN(d.getTime())) return '—';
  return d.toLocaleString('pt-PT');
}

// Aceita Date, string ISO yyyy-mm-dd, ou string pt dd/mm/yyyy (com / ou -).
// Retorna sempre string yyyy-mm-dd ou null.
function parseDateValue(v) {
  if (v === null || v === undefined || v === '') return null;
  if (v instanceof Date && !isNaN(v.getTime())) {
    return v.toISOString().slice(0, 10);
  }
  const s = String(v).trim();
  if (!s) return null;
  // ISO yyyy-mm-dd
  const isoMatch = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (isoMatch) {
    const [, y, m, d] = isoMatch;
    return `${y}-${m.padStart(2,'0')}-${d.padStart(2,'0')}`;
  }
  // PT dd/mm/yyyy ou dd-mm-yyyy
  const ptMatch = s.match(/^(\d{1,2})[\/\-\.](\d{1,2})[\/\-\.](\d{2,4})/);
  if (ptMatch) {
    let [, d, m, y] = ptMatch;
    if (y.length === 2) y = (parseInt(y, 10) >= 50 ? '19' : '20') + y;
    return `${y}-${m.padStart(2,'0')}-${d.padStart(2,'0')}`;
  }
  // Tentar Date.parse genérico
  const parsed = new Date(s);
  if (!isNaN(parsed.getTime())) return parsed.toISOString().slice(0, 10);
  return null;
}

function daysUntil(v) {
  if (!v) return null;
  const d = new Date(v);
  const today = new Date();
  today.setHours(0,0,0,0);
  d.setHours(0,0,0,0);
  return Math.round((d - today) / 86400000);
}

function badge(value) {
  if (!value) return '';
  const key = value.toLowerCase()
    .replace(/á/g,'a').replace(/ã/g,'a').replace(/ç/g,'c')
    .replace(/ó/g,'o').replace(/é/g,'e').replace(/í/g,'i').replace(/ú/g,'u')
    .replace(/\s+/g,'');
  return `<span class="badge badge-${key}">${escapeHtml(value)}</span>`;
}

// ---------- AUTH ----------
async function checkAuth() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return false;

  const { data: userRow, error } = await sb
    .from('siga_users')
    .select('*')
    .eq('email', session.user.email)
    .maybeSingle();

  if (error || !userRow || !userRow.ativo) {
    await sb.auth.signOut();
    return false;
  }

  state.user = session.user;
  state.userRole = userRow.papel;
  state.userName = userRow.nome || session.user.email;
  return true;
}

async function login() {
  const email = $('#login-email').value.trim();
  const password = $('#login-password').value;
  const errEl = $('#login-error');
  const btn = $('#login-btn');

  if (!email || !password) {
    errEl.textContent = 'Introduz email e password.';
    return;
  }
  errEl.textContent = '';
  btn.disabled = true;
  btn.textContent = 'A entrar...';

  const { error } = await sb.auth.signInWithPassword({ email, password });

  if (error) {
    errEl.textContent = 'Credenciais inválidas.';
    btn.disabled = false;
    btn.textContent = 'Entrar';
    return;
  }

  const ok = await checkAuth();
  if (!ok) {
    errEl.textContent = 'Utilizador inativo ou sem permissões.';
    btn.disabled = false;
    btn.textContent = 'Entrar';
    return;
  }

  await startApp();
}

  location.reload();

// ---------- SORT / FILTER ----------
function sortRows(rows, key, dir) {
  return [...rows].sort((a, b) => {
    let va = a[key], vb = b[key];
    if (va === null || va === undefined) va = '';
    if (vb === null || vb === undefined) vb = '';
    if (typeof va === 'number' && typeof vb === 'number') return dir === 'asc' ? va - vb : vb - va;
    if (/^\d{4}-\d{2}-\d{2}/.test(va) || va instanceof Date) {
      const da = new Date(va).getTime() || 0;
      const db = new Date(vb).getTime() || 0;
      return dir === 'asc' ? da - db : db - da;
    }
    return dir === 'asc'
      ? String(va).localeCompare(String(vb), 'pt')
      : String(vb).localeCompare(String(va), 'pt');
  });
}

function applyFilters(rows, filters, searchFields) {
  return rows.filter(r => {
    if (filters.status && r.status !== filters.status) return false;
    if (filters.estado && r.estado !== filters.estado) return false;
    if (filters.search) {
      const q = filters.search.toLowerCase();
      const match = searchFields.some(f => {
        const v = r[f];
        return v && String(v).toLowerCase().includes(q);
      });
      if (!match) return false;
    }
    return true;
  });
}

// ---------- XLSX IMPORT/EXPORT ----------
function exportXLSX(rows, fields, filename) {
  const data = rows.map(r => {
    const out = {};
    fields.forEach(f => { out[f.label] = f.format ? f.format(r[f.key]) : r[f.key]; });
    return out;
  });
  const ws = XLSX.utils.json_to_sheet(data);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Dados');
  XLSX.writeFile(wb, filename);
  showToast('Exportado ' + rows.length + ' registos', 'success');
}

async function importXLSX(table, mapRow) {
  return new Promise(resolve => {
    const inp = $('#xlsx-file-input');
    inp.value = '';
    inp.onchange = async () => {
      const file = inp.files[0];
      if (!file) { resolve(false); return; }
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, { type: 'array', cellDates: true });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, { defval: null });
      const mapped = rows.map(mapRow).filter(Boolean);
      if (!mapped.length) {
        showToast('Nenhum registo válido no ficheiro', 'error');
        resolve(false); return;
      }

      // Pergunta modo: adicionar ou substituir
      const mode = await askImportMode(mapped.length);
      if (!mode) { resolve(false); return; }

      if (mode === 'replace') {
        const { error: delErr } = await sb.from(table).delete().not('id', 'is', null);
        if (delErr) {
          showToast('Erro a limpar: ' + delErr.message, 'error');
          resolve(false); return;
        }
      }

      const { error } = await sb.from(table).insert(mapped);
      if (error) {
        showToast('Erro: ' + error.message, 'error');
        resolve(false); return;
      }
      showToast(
        (mode === 'replace' ? 'Substituído por ' : 'Adicionados ') + mapped.length + ' registos',
        'success'
      );
      resolve(true);
    };
    inp.click();
  });
}

function askImportMode(count) {
  return new Promise(resolve => {
    showModal(`
      <div class="modal-header">
        <div class="modal-title">Modo de importação</div>
        <button class="modal-close" onclick="closeModal()">×</button>
      </div>
      <div class="modal-body">
        <p>O ficheiro tem <strong>${count}</strong> registos válidos.</p>
        <p class="text-small text-muted mb">Como queres importar?</p>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="import-cancel">Cancelar</button>
        <button class="btn btn-secondary" id="import-add">Adicionar aos existentes</button>
        <button class="btn btn-danger" id="import-replace">Substituir tudo</button>
      </div>
    `, 'sm');
    $('#import-cancel').onclick = () => { closeModal(); resolve(null); };
    $('#import-add').onclick = () => { closeModal(); resolve('add'); };
    $('#import-replace').onclick = () => {
      if (confirm('Vai eliminar TODOS os registos atuais antes de importar. Continuar?')) {
        closeModal(); resolve('replace');
      }
    };
  });
}

async function deleteAllRows(table, label, reloadKey) {
  const n = state.data[reloadKey].length;
  if (n === 0) { showToast('Nada para apagar', ''); return; }
  if (!confirm('Vai eliminar TODOS os ' + n + ' registos de ' + label + '. Esta ação é irreversível. Continuar?')) return;
  const confirmText = prompt('Para confirmar, escreve APAGAR em maiúsculas:');
  if (confirmText !== 'APAGAR') { showToast('Cancelado', ''); return; }
  const { error } = await sb.from(table).delete().not('id', 'is', null);
  if (error) { showToast('Erro: ' + error.message, 'error'); return; }
  await reloadTable(reloadKey);
  if (reloadKey === 'concursos') renderConcursos();
  else if (reloadKey === 'inspect') renderInspect();
  showToast('Eliminados ' + n + ' registos', 'success');
}

// ---------- AI ANALYSIS ----------
async function analyzeRecord(type, record) {
  try {
    const resp = await fetch('/api/analisar', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ type, record })
    });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const data = await resp.json();
    return data.analysis;
  } catch (e) {
    console.error(e);
    throw new Error('Falhou a análise IA: ' + e.message);
  }
}

function renderConcursos() {
  if (state.concursoView === 'financeiro') { renderConcursoFinanceiro(); return; }

  renderConcursoListagem();

  const { search, estado } = state.filters.concursos;

  if (search) {
    const q = search.toLowerCase();

      (c.nome || '').toLowerCase().includes(q) ||
      (c.sigla || '').toLowerCase().includes(q) ||
      (c.localizacao || '').toLowerCase().includes(q) ||
      (c.entidade || '').toLowerCase().includes(q)

  if (estado) data = data.filter(c => c.estado === estado);

  data.sort((a, b) => {
    let va = a[key], vb = b[key];
    if (va == null) return 1;
    if (vb == null) return -1;
    if (typeof va === 'string') { va = va.toLowerCase(); vb = (vb||'').toLowerCase(); }
    if (va < vb) return dir === 'asc' ? -1 : 1;
    if (va > vb) return dir === 'asc' ? 1 : -1;
    return 0;

}

async function saveConcurso(id) {
  const form = $('#form-concurso');
  const rec = {};
  new FormData(form).forEach((val, key) => { rec[key] = val === '' ? null : val; });
  // Checkboxes do âmbito (FormData só inclui os marcados)
  CONFIG.CONCURSO_AMBITOS.forEach(a => { rec[a.key] = form[a.key].checked; });

  ['valor_base','caucao','valor_aceitar','valor_vencedor'].forEach(k => { if (rec[k]) rec[k] = parseFloat(rec[k]); });
  ['duracao_meses','posicao'].forEach(k => { if (rec[k]) rec[k] = parseInt(rec[k]); });

  // Estado inicial: regista a data correspondente
  if (!id && rec.estado) {
    const today = new Date().toISOString().slice(0,10);
    if (rec.estado === 'Aprovado') rec.data_aprovado = today;
    else if (rec.estado === 'Não Aprovado') rec.data_nao_aprovado = today;
  }

  const { error } = id
    ? await sb.from('concursos').update(rec).eq('id', id)
    : await sb.from('concursos').insert(rec);
  if (error) { showToast('Erro: ' + error.message, 'error'); return; }
  closeModal();
  await reloadTable('concursos');
  renderConcursos();
  showToast(id ? 'Concurso atualizado' : 'Concurso criado', 'success');
}

function deleteConcurso(id) {
  if (!confirm('Eliminar este concurso?')) return;
  sb.from('concursos').delete().eq('id', id).then(async ({ error }) => {
    if (error) { showToast('Erro: ' + error.message, 'error'); return; }
    await reloadTable('concursos');
    renderConcursos();
    showToast('Concurso eliminado', 'success');
  });
}

function openConcursoTransition(id, transicao) {
  const today = new Date().toISOString().slice(0,10);
  const extras = transicao.extras || [];
  const r = state.data.concursos.find(x => x.id === id);

  const extrasHTML = extras.map((ex, i) => {
    if (ex.type === 'number') {
      const v = r?.[ex.field];
      return `<div class="form-group"><label>${ex.label}</label><input type="number" step="0.01" class="form-control" id="cex-${i}" value="${v ?? ''}"></div>`;
    }
    return `<div class="form-group"><label>${ex.label}</label><input class="form-control" id="cex-${i}" value="${escapeHtml(r?.[ex.field])}"></div>`;
  }).join('');

  showModal(`
    <div class="modal-header">
      <div class="modal-title">${escapeHtml(transicao.label)}</div>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body">
      <form id="form-ctrans" onsubmit="event.preventDefault();return false;">
        <div class="form-group">
          <label>${transicao.dataLabel} <span class="required">*</span></label>
          <input type="date" class="form-control" id="ctrans-date" value="${today}">
        </div>
        ${extrasHTML}
      </form>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
      <button class="btn ${transicao.danger ? 'btn-danger' : 'btn-primary'}" id="ctrans-confirm">Confirmar</button>
    </div>
  `, 'sm');

  $('#ctrans-confirm').onclick = async () => {
    const dateValue = $('#ctrans-date').value;
    if (!dateValue) { showToast('Data obrigatória', 'error'); return; }
    const update = { estado: transicao.para, [transicao.dataField]: dateValue };
    extras.forEach((ex, i) => {
      const raw = $('#cex-' + i).value;
      if (raw !== '') update[ex.field] = ex.type === 'number' ? parseFloat(raw) : raw;
    });
    // Guardar resultado preliminar quando se marca Ganho/Perdido
    if (transicao.para === 'Ganho') { update.rel_preliminar = 'Ganho'; update.data_rel_preliminar = dateValue; }
    if (transicao.para === 'Perdido') { update.rel_preliminar = 'Perdido'; update.data_rel_preliminar = dateValue; }
    const { error } = await sb.from('concursos').update(update).eq('id', id);
    if (error) { showToast('Erro: ' + error.message, 'error'); return; }
    closeModal();
    await reloadTable('concursos');
    renderConcursos();
    openConcursoDetail(id);
    showToast('Estado atualizado para ' + transicao.para, 'success');
  };
}

async function importConcursos() {
  const ok = await importXLSX('concursos', row => {
    if (!row['Nome'] && !row['Nome (Short)'] && !row['Sigla']) return null;
    const truthy = v => {
      const s = String(v ?? '').trim().toLowerCase();
      return s === 'x' || s === 'sim' || s === 'true' || s === '1';
    };
    return {
      nome: row['Nome'] || row['Nome (Short)'] || null,
      ambito_fisc: truthy(row['FISC']),
      ambito_cso: truthy(row['CSO']),
      ambito_qual: truthy(row['QUAL']),
      ambito_amb: truthy(row['AMB']),
      ambito_proj: truthy(row['PROJ']),
      sigla: row['Sigla'] || null,
      localizacao: row['Localização'] || row['Localizacao'] || null,
      plataforma: row['Plataforma'] || null,
      valor_base: (row['Valor Base'] != null && row['Valor Base'] !== '') ? parseFloat(row['Valor Base']) : null,
      caucao: (row['Caução'] != null && row['Caução'] !== '') ? parseFloat(row['Caução']) : null,
      duracao_meses: (row['Duração (meses)'] != null && row['Duração (meses)'] !== '') ? parseInt(row['Duração (meses)']) : null,
      data: parseDateValue(row['Data']),
      estado: CONFIG.CONCURSO_ESTADOS.includes(row['Status']) ? row['Status']
             : CONFIG.CONCURSO_ESTADOS.includes(row['Estado']) ? row['Estado']
             : 'Aprovado',
      valor_aceitar: (row['Valor Aceitar'] != null && row['Valor Aceitar'] !== '') ? parseFloat(row['Valor Aceitar']) : null,
      posicao: (row['Posição'] != null && row['Posição'] !== '') ? parseInt(row['Posição']) : null,
      valor_vencedor: (row['Valor Vencedor'] != null && row['Valor Vencedor'] !== '') ? parseFloat(row['Valor Vencedor']) : null,
      entidade: row['Entidade'] || null
    };
  });
  if (ok) { await reloadTable('concursos'); renderConcursos(); }
}

function renderConcursoAnalise() {
  const data = state.data.concursos;
  const total = data.length;

  // --- Conjuntos por fase ---
  const aprovadosArr = data.filter(c => c.estado !== 'Não Aprovado');
  const aprovados = aprovadosArr.length;
  const naoAprovados = data.filter(c => c.estado === 'Não Aprovado').length;

  const comResultadoArr = data.filter(c =>
    ['Ganho','Perdido','Adjudicado','Não Adjudicado','Eliminado','Aguarda Confirmação'].includes(c.estado)
  );
  const comResultado = comResultadoArr.length;

  // rel_preliminar (coexiste com estado): contabiliza pelo campo preliminar
  const ganhosPrelim = data.filter(c => c.rel_preliminar === 'Ganho').length;
  const perdidosPrelim = data.filter(c => c.rel_preliminar === 'Perdido').length;

  const adjudicados = data.filter(c => c.estado === 'Adjudicado').length;
  const naoAdjudicados = data.filter(c => c.estado === 'Não Adjudicado').length;
  const eliminados = data.filter(c => c.estado === 'Eliminado').length;
  const aguardaResultado = data.filter(c => c.estado === 'Aguarda Resultado').length;
  const aguardaConfirmacao = data.filter(c => c.estado === 'Aguarda Confirmação').length;

  // Taxas
  const taxaAprovacao = total > 0 ? (aprovados / total * 100) : 0;
  const taxaPreliminar = comResultado > 0 ? (ganhosPrelim / (ganhosPrelim + perdidosPrelim || 1) * 100) : 0;
  const decididos = adjudicados + naoAdjudicados + eliminados;
  const taxaAdjudicacao = decididos > 0 ? (adjudicados / decididos * 100) : 0;
  const taxaEliminacao = decididos > 0 ? (eliminados / decididos * 100) : 0;

  // --- Valores ---
  const valorBaseTotal = data.reduce((s, c) => s + (Number(c.valor_base) || 0), 0);
  const valorAceitarTotal = data.reduce((s, c) => s + (Number(c.valor_aceitar) || 0), 0);
  const valorAceitarAdjudicado = data.filter(c => c.estado === 'Adjudicado').reduce((s, c) => s + (Number(c.valor_aceitar) || 0), 0);
  const valorVencedorTotal = data.filter(c => c.valor_vencedor).reduce((s, c) => s + (Number(c.valor_vencedor) || 0), 0);

  // Diferença Aceitar vs Vencedor (só onde temos ambos)
  const comparaveis = data.filter(c => c.valor_aceitar && c.valor_vencedor);
  const diffMediaPct = comparaveis.length > 0
    ? comparaveis.reduce((s, c) => s + ((c.valor_aceitar - c.valor_vencedor) / c.valor_vencedor * 100), 0) / comparaveis.length
    : 0;

  const ticketMedioAdj = adjudicados > 0 ? valorAceitarAdjudicado / adjudicados : 0;
  const maior = data.reduce((m, c) => (Number(c.valor_base) || 0) > (m?.valor_base || 0) ? c : m, null);

  // --- Dimensões ---
  const porEstado = {};
  data.forEach(c => { porEstado[c.estado || '—'] = (porEstado[c.estado || '—'] || 0) + 1; });

  const porPlataforma = {};
  data.forEach(c => { const p = c.plataforma || '—'; porPlataforma[p] = (porPlataforma[p] || 0) + 1; });

  // Por âmbito: nº de concursos com cada checkbox + taxa de sucesso por âmbito
  const porAmbito = {};
  CONFIG.CONCURSO_AMBITOS.forEach(a => {
    const subset = data.filter(c => c[a.key]);
    const adj = subset.filter(c => c.estado === 'Adjudicado').length;
    const dec = subset.filter(c => ['Adjudicado','Não Adjudicado','Eliminado'].includes(c.estado)).length;
    porAmbito[a.label] = {
      total: subset.length,
      adjudicados: adj,
      taxa: dec > 0 ? (adj / dec * 100) : 0
    };
  });

  // Top entidades (sigla)
  const porSigla = {};
  data.forEach(c => { const s = c.sigla || '—'; porSigla[s] = (porSigla[s] || 0) + 1; });
  const topSiglas = Object.entries(porSigla).sort((a, b) => b[1] - a[1]).slice(0, 10);

  // Top localizações
  const porLoc = {};
  data.forEach(c => { const l = c.localizacao || '—'; porLoc[l] = (porLoc[l] || 0) + 1; });
  const topLoc = Object.entries(porLoc).sort((a, b) => b[1] - a[1]).slice(0, 10);

  // Evolução mensal
  const meses = {};
  data.forEach(c => {
    if (!c.data) return;
    const k = c.data.slice(0, 7); // YYYY-MM
    if (!meses[k]) meses[k] = { count: 0, valorBase: 0, ganhos: 0, adjudicados: 0 };
    meses[k].count++;
    meses[k].valorBase += Number(c.valor_base) || 0;
    if (c.rel_preliminar === 'Ganho') meses[k].ganhos++;
    if (c.estado === 'Adjudicado') meses[k].adjudicados++;
  });
  const mesesOrd = Object.keys(meses).sort();
  const mesLabel = m => {
    const [y, mo] = m.split('-');
    const names = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
    return names[parseInt(mo)-1] + '/' + y.slice(2);
  };

  // Por plataforma — também taxa de sucesso
  const platDetail = {};
  Object.keys(porPlataforma).forEach(p => {
    const subset = data.filter(c => (c.plataforma || '—') === p);
    const adj = subset.filter(c => c.estado === 'Adjudicado').length;
    const dec = subset.filter(c => ['Adjudicado','Não Adjudicado','Eliminado'].includes(c.estado)).length;
    platDetail[p] = {
      total: subset.length,
      adjudicados: adj,
      taxa: dec > 0 ? (adj / dec * 100) : 0
    };
  });

  // Cores estado fixas
  const estadoColors = {
    'Aprovado': '#0ea5e9',
    'Não Aprovado': '#f87171',
    'Aguarda Resultado': '#fbbf24',
    'Ganho': '#34d399',
    'Perdido': '#ef4444',
    'Adjudicado': '#22c55e',
    'Não Adjudicado': '#dc2626',
    'Eliminado': '#94a3b8',
    'Aguarda Confirmação': '#f59e0b',
    '—': '#cbd5e1'
  };

  $('#section-concursos').innerHTML = `
    <div class="page-header">
      <div>
        <div class="page-title">Concursos — Análise</div>
        <div class="page-subtitle">${total} concursos · ${comResultado} com resultado</div>
      </div>
      <div class="page-actions">
        <div class="tabs">
          <button class="tab-btn" onclick="switchConcursoView('listagem')">Listagem</button>
          <button class="tab-btn" onclick="switchConcursoView('financeiro')">Financeiro</button>
          <button class="tab-btn active" onclick="switchConcursoView('analise')">Análise</button>
        </div>
      </div>
    </div>

    <!-- KPIs Volume -->
    <h4 style="margin:8px 0 12px">Volume</h4>
    <div class="kpi-grid">
      <div class="kpi-card"><div class="kpi-label">Total</div><div class="kpi-value">${total}</div><div class="kpi-sub">concursos registados</div></div>
      <div class="kpi-card"><div class="kpi-label">Aprovados</div><div class="kpi-value" style="color:var(--success)">${aprovados}</div><div class="kpi-sub">taxa ${taxaAprovacao.toFixed(0)}%</div></div>
      <div class="kpi-card"><div class="kpi-label">Não aprovados</div><div class="kpi-value" style="color:var(--danger)">${naoAprovados}</div><div class="kpi-sub">${total > 0 ? (naoAprovados/total*100).toFixed(0) : 0}%</div></div>
      <div class="kpi-card"><div class="kpi-label">A decorrer</div><div class="kpi-value" style="color:var(--gold)">${aguardaResultado + aguardaConfirmacao}</div><div class="kpi-sub">${aguardaResultado} aguarda res. · ${aguardaConfirmacao} aguarda conf.</div></div>
    </div>

    <div class="kpi-grid" style="margin-bottom:24px">
      <div class="kpi-card"><div class="kpi-label">Ganho preliminar</div><div class="kpi-value" style="color:var(--success)">${ganhosPrelim}</div><div class="kpi-sub">passámos a avaliação</div></div>
      <div class="kpi-card"><div class="kpi-label">Adjudicados</div><div class="kpi-value" style="color:var(--success)">${adjudicados}</div></div>
      <div class="kpi-card"><div class="kpi-label">Não adjudicados</div><div class="kpi-value" style="color:var(--danger)">${naoAdjudicados}</div></div>
      <div class="kpi-card"><div class="kpi-label">Eliminados</div><div class="kpi-value" style="color:var(--danger)">${eliminados}</div></div>
    </div>

    <!-- KPIs Financeiros -->
    <h4 style="margin:8px 0 12px">Valor financeiro</h4>
    <div class="kpi-grid">
      <div class="kpi-card"><div class="kpi-label">Valor base total</div><div class="kpi-value">${fmtCurrency(valorBaseTotal)}</div><div class="kpi-sub">todos os concursos</div></div>
      <div class="kpi-card"><div class="kpi-label">Valor Aceitar acumulado</div><div class="kpi-value">${fmtCurrency(valorAceitarTotal)}</div><div class="kpi-sub">nossas propostas</div></div>
      <div class="kpi-card"><div class="kpi-label">Valor adjudicado</div><div class="kpi-value" style="color:var(--success)">${fmtCurrency(valorAceitarAdjudicado)}</div><div class="kpi-sub">propostas vencedoras</div></div>
      <div class="kpi-card"><div class="kpi-label">Ticket médio adjudicado</div><div class="kpi-value">${fmtCurrency(ticketMedioAdj)}</div></div>
    </div>

    <div class="kpi-grid" style="margin-bottom:24px">
      <div class="kpi-card"><div class="kpi-label">Aceitar vs Vencedor (média)</div><div class="kpi-value" style="color:${diffMediaPct > 0 ? 'var(--danger)' : 'var(--success)'}">${diffMediaPct > 0 ? '+' : ''}${diffMediaPct.toFixed(1)}%</div><div class="kpi-sub">${comparaveis.length} concursos comparáveis</div></div>
      <div class="kpi-card"><div class="kpi-label">Maior concurso</div><div class="kpi-value">${fmtCurrency(maior?.valor_base)}</div><div class="kpi-sub">${escapeHtml(maior?.sigla) || '—'}</div></div>
      <div class="kpi-card"><div class="kpi-label">Valor vencedor total</div><div class="kpi-value">${fmtCurrency(valorVencedorTotal)}</div><div class="kpi-sub">de outras entidades</div></div>
    </div>

    <!-- KPIs Taxas -->
    <h4 style="margin:8px 0 12px">Taxas de sucesso</h4>
    <div class="kpi-grid" style="margin-bottom:24px">
      <div class="kpi-card"><div class="kpi-label">Taxa de aprovação</div><div class="kpi-value">${taxaAprovacao.toFixed(1)}%</div><div class="kpi-sub">aprovados / total</div></div>
      <div class="kpi-card"><div class="kpi-label">Taxa preliminar</div><div class="kpi-value">${taxaPreliminar.toFixed(1)}%</div><div class="kpi-sub">ganhámos a avaliação</div></div>
      <div class="kpi-card"><div class="kpi-label">Taxa de adjudicação</div><div class="kpi-value" style="color:var(--success)">${taxaAdjudicacao.toFixed(1)}%</div><div class="kpi-sub">adjudicados / decididos</div></div>
      <div class="kpi-card"><div class="kpi-label">Taxa de eliminação</div><div class="kpi-value" style="color:var(--danger)">${taxaEliminacao.toFixed(1)}%</div><div class="kpi-sub">eliminados / decididos</div></div>
    </div>

    <!-- Evolução temporal -->
    <h4 style="margin:8px 0 12px">Evolução mensal</h4>
    <div class="card mb-lg">
      <div style="height:280px;position:relative"><canvas id="chart-conc-mensal"></canvas></div>
    </div>

    <!-- Distribuições -->
    <h4 style="margin:8px 0 12px">Dimensões</h4>
    <div class="chart-grid">
      <div class="card">
        <h4>Por estado</h4>
        <div style="height:240px;position:relative"><canvas id="chart-conc-estado"></canvas></div>
      </div>
      <div class="card">
        <h4>Por plataforma</h4>
        <div style="height:240px;position:relative"><canvas id="chart-conc-plat"></canvas></div>
      </div>
    </div>

    <div class="chart-grid">
      <div class="card">
        <h4>Por âmbito — Volume vs Adjudicados</h4>
        <div style="height:240px;position:relative"><canvas id="chart-conc-ambito"></canvas></div>
      </div>
      <div class="card">
        <h4>Por âmbito — Taxa de adjudicação</h4>
        <div class="table-wrapper">
          <table class="data-table analytics">
            <thead><tr><th>Âmbito</th><th class="num">Concursos</th><th class="num">Adjudicados</th><th class="num">Taxa</th></tr></thead>
            <tbody>
              ${Object.entries(porAmbito).map(([k, v]) => `
                <tr>
                  <td><strong>${k}</strong></td>
                  <td class="num">${v.total}</td>
                  <td class="num">${v.adjudicados}</td>
                  <td class="num"><strong style="color:${v.taxa>=50?'var(--success)':v.taxa>0?'var(--gold-dark)':'var(--danger)'}">${v.taxa.toFixed(1)}%</strong></td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <div class="chart-grid">
      <div class="card">
        <h4>Top 10 entidades</h4>
        <div class="table-wrapper">
          <table class="data-table analytics">
            <thead><tr><th>Sigla</th><th class="num">Concursos</th></tr></thead>
            <tbody>
              ${topSiglas.length === 0
                ? `<tr class="empty-row"><td colspan="2">Sem dados</td></tr>`
                : topSiglas.map(([s, n]) => `<tr><td>${escapeHtml(s)}</td><td class="num">${n}</td></tr>`).join('')}
            </tbody>
          </table>
        </div>
      </div>
      <div class="card">
        <h4>Top 10 localizações</h4>
        <div class="table-wrapper">
          <table class="data-table analytics">
            <thead><tr><th>Localização</th><th class="num">Concursos</th></tr></thead>
            <tbody>
              ${topLoc.length === 0
                ? `<tr class="empty-row"><td colspan="2">Sem dados</td></tr>`
                : topLoc.map(([l, n]) => `<tr><td>${escapeHtml(l)}</td><td class="num">${n}</td></tr>`).join('')}
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <div class="card">
      <h4>Plataformas — Taxa de adjudicação</h4>
      <div class="table-wrapper">
        <table class="data-table analytics">
          <thead><tr><th>Plataforma</th><th class="num">Total</th><th class="num">Adjudicados</th><th class="num">Taxa</th></tr></thead>
          <tbody>
            ${Object.entries(platDetail).sort((a,b) => b[1].total - a[1].total).map(([p, v]) => `
              <tr>
                <td><strong>${escapeHtml(p)}</strong></td>
                <td class="num">${v.total}</td>
                <td class="num">${v.adjudicados}</td>
                <td class="num"><strong style="color:${v.taxa>=50?'var(--success)':v.taxa>0?'var(--gold-dark)':'var(--danger)'}">${v.taxa.toFixed(1)}%</strong></td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    </div>
  `;

  // ---- Gráficos ----

  // 1. Evolução mensal: 2 datasets (Volume e Valor base) com 2 eixos
  if (state.charts.concMensal) state.charts.concMensal.destroy();
  if (mesesOrd.length) {
    state.charts.concMensal = new Chart($('#chart-conc-mensal'), {
      type: 'bar',
      data: {
        labels: mesesOrd.map(mesLabel),
        datasets: [
          {
            type: 'bar',
            label: 'Concursos',
            data: mesesOrd.map(m => meses[m].count),
            backgroundColor: 'rgba(26,58,92,0.6)',
            yAxisID: 'y',
            order: 2
          },
          {
            type: 'line',
            label: 'Valor base (€)',
            data: mesesOrd.map(m => meses[m].valorBase),
            borderColor: '#c9a24a',
            backgroundColor: '#c9a24a',
            tension: 0.3,
            yAxisID: 'y1',
            order: 1
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: { mode: 'index', intersect: false },
        plugins: { legend: { position: 'top' } },
        scales: {
          y: { type: 'linear', position: 'left', beginAtZero: true, title: { display: true, text: 'Nº concursos' } },
          y1: { type: 'linear', position: 'right', beginAtZero: true, grid: { drawOnChartArea: false }, title: { display: true, text: 'Valor (€)' },
                ticks: { callback: v => (v / 1000).toLocaleString('pt-PT') + 'k' } }
        }
      }
    });
  }

  // 2. Estado (doughnut com legenda em baixo, abreviada se preciso)
  if (state.charts.concEstado) state.charts.concEstado.destroy();
  const estLabels = Object.keys(porEstado);
  if (estLabels.length) state.charts.concEstado = new Chart($('#chart-conc-estado'), {
    type: 'doughnut',
    data: {
      labels: estLabels,
      datasets: [{
        data: estLabels.map(e => porEstado[e]),
        backgroundColor: estLabels.map(e => estadoColors[e] || '#94a3b8'),
        borderWidth: 2,
        borderColor: '#fff'
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 11 }, padding: 8 } },
        tooltip: { callbacks: { label: ctx => `${ctx.label}: ${ctx.parsed} (${(ctx.parsed/total*100).toFixed(1)}%)` } }
      }
    }
  });

  // 3. Plataforma — bar horizontal para acomodar nomes
  if (state.charts.concPlat) state.charts.concPlat.destroy();
  const platLabels = Object.keys(porPlataforma);
  if (platLabels.length) state.charts.concPlat = new Chart($('#chart-conc-plat'), {
    type: 'bar',
    data: {
      labels: platLabels,
      datasets: [{ label: 'Concursos', data: platLabels.map(p => porPlataforma[p]), backgroundColor: '#1a3a5c' }]
    },
    options: {
      indexAxis: 'y',
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: { x: { beginAtZero: true, ticks: { precision: 0 } } }
    }
  });

  // 4. Âmbito — barras agrupadas (Total + Adjudicados)
  if (state.charts.concAmbito) state.charts.concAmbito.destroy();
  const ambLabels = Object.keys(porAmbito);
  state.charts.concAmbito = new Chart($('#chart-conc-ambito'), {
    type: 'bar',
    data: {
      labels: ambLabels,
      datasets: [
        { label: 'Total', data: ambLabels.map(a => porAmbito[a].total), backgroundColor: '#1a3a5c' },
        { label: 'Adjudicados', data: ambLabels.map(a => porAmbito[a].adjudicados), backgroundColor: '#c9a24a' }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { position: 'top' } },
      scales: { y: { beginAtZero: true, ticks: { precision: 0 } } }
    }
  });
}

// ACEITAR INSPECT
// ============================================================
function renderInspect() {
  if (state.inspectView === 'analise') {
    renderInspectAnalise();
    return;
  }
  if (state.inspectView === 'financeiro') {
    renderInspectFinanceiro();
    return;
  }
  if (state.inspectView === 'duplicados') {
    renderInspectDuplicados();
    return;
  }

  const { search, estado } = state.filters.inspect;
  const { key, dir } = state.sort.inspect;
  let rows = applyFilters(
    state.data.inspect,
    state.filters.inspect,
    ['id_pedido','cliente','email','telefone','localizacao','tipo_servico']
  );
  rows = sortRows(rows, key, dir);

  const estadoOptions = CONFIG.INSPECT_ESTADOS.map(s =>
    `<option value="${s}" ${estado===s?'selected':''}>${s}</option>`
  ).join('');

  const cols = [
    { key: 'id_pedido', label: 'ID' },
    { key: 'referencia', label: 'Referência' },
    { key: 'data_pedido', label: 'Data Pedido' },
    { key: 'cliente', label: 'Cliente' },
    { key: 'localizacao', label: 'Localização' },
    { key: 'telefone', label: 'Telemóvel' },
    { key: 'email', label: 'Email' },
    { key: 'estado', label: 'Estado' }
  ];

  $('#section-inspect').innerHTML = `
    <div class="page-header">
      <div>
        <div class="page-title">Aceitar Inspect</div>
        <div class="page-subtitle">${state.data.inspect.length} pedidos · ${rows.length} visíveis</div>
      </div>
      <div class="page-actions">
        <div class="tabs">
          <button class="tab-btn active" onclick="switchInspectView('listagem')">Listagem</button>
          ${isAdmin() ? `<button class="tab-btn" onclick="switchInspectView('duplicados')">Duplicados</button>` : ''}
          <button class="tab-btn" onclick="switchInspectView('financeiro')">Financeiro</button>
          <button class="tab-btn" onclick="switchInspectView('analise')">Análise</button>
        </div>
        <button class="btn btn-secondary" onclick="exportInspect()">⬇ Export XLSX</button>
        ${canEdit() ? `
          <button class="btn btn-secondary" onclick="importInspect()">⬆ Import XLSX</button>
          <button class="btn btn-gold" onclick="openInspectModal()">+ Novo Pedido</button>
        ` : ''}
        ${isAdmin() ? `
          <button class="btn btn-ghost btn-sm" onclick="atribuirIDFic()" title="Atribuir IDFic sequencial a todos os pedidos">🔢 Atribuir IDFic</button>
          <button class="btn btn-ghost btn-sm" onclick="atualizarIdPedidoPorExcel()" title="Atualizar id_pedido via Excel (match por IDFic)">🔄 Atualizar ID Pedido</button>
          <button class="btn btn-ghost btn-sm" style="color:var(--danger)" onclick="deleteAllRows('inspect_pedidos','Aceitar Inspect','inspect')" title="Apagar todos os registos">🗑 Apagar tudo</button>
        ` : ''}
      </div>
    </div>

    <div class="card">
      <div class="filter-bar">
        <input type="text" class="form-control search" id="inspect-search" placeholder="Pesquisar..."
               value="${escapeHtml(search)}" oninput="state.filters.inspect.search = this.value; renderInspectPreserveFocus();">
        <select class="form-control" onchange="state.filters.inspect.estado = this.value; renderInspect();">
          <option value="">Todos os estados</option>
          ${estadoOptions}
        </select>
        <button class="btn btn-ghost btn-sm" onclick="state.filters.inspect={search:'',estado:''};renderInspect();">Limpar</button>
      </div>
      <div class="table-wrapper">
        <table class="data-table">
          <thead>
            <tr>
              ${cols.map(c => `
                <th class="${c.num?'num':''} ${key===c.key ? 'sort-'+dir : ''}"
                    onclick="toggleSort('inspect','${c.key}')">${c.label}</th>
              `).join('')}
              <th></th>
            </tr>
          </thead>
          <tbody>
            ${rows.length === 0
              ? `<tr class="empty-row"><td colspan="${cols.length+1}">Sem registos</td></tr>`
              : rows.map(r => `
                <tr class="clickable" onclick="openInspectDetail('${r.id}')">
                  <td>${escapeHtml(r.id_pedido)}</td>
                  <td>${escapeHtml(r.referencia)}</td>
                  <td>${fmtDate(r.data_pedido)}</td>
                  <td><strong>${escapeHtml(r.cliente)}</strong></td>
                  <td>${escapeHtml(r.localizacao)}</td>
                  <td>${escapeHtml(r.telefone)}</td>
                  <td>${escapeHtml(r.email)}</td>
                  <td>${badge(r.estado)}</td>
                  <td onclick="event.stopPropagation()">
                    <div class="actions">
                      ${canEdit() ? `
                        <button class="btn btn-ghost btn-sm" onclick="openInspectModal('${r.id}')" title="Editar">✎</button>
                      ` : ''}
                      ${isAdmin() ? `
                        <button class="btn btn-ghost btn-sm" onclick="deleteInspect('${r.id}')" title="Eliminar" style="color:var(--danger)">🗑</button>
                      ` : ''}
                    </div>
                  </td>
                </tr>
              `).join('')}
          </tbody>
        </table>
      </div>
    </div>
  `;
}

function switchInspectView(view) {
  state.inspectView = view;
  renderInspect();
}

// Re-render preservando foco do input de pesquisa e posição do cursor
function renderInspectPreserveFocus() {
  const el = document.activeElement;
  const isSearch = el && el.id === 'inspect-search';
  const pos = isSearch ? el.selectionStart : null;
  renderInspect();
  if (isSearch) {
    const newEl = document.getElementById('inspect-search');
    if (newEl) {
      newEl.focus();
      if (pos !== null) newEl.setSelectionRange(pos, pos);
    }
  }
}

// ============================================================
// ACEITAR INSPECT — VISTA FINANCEIRO
// ============================================================
function renderInspectFinanceiro() {
  // Pedidos relevantes: Adjudicada em diante
  const data = state.data.inspect.filter(r =>
    ['Adjudicada','Agendada','Realizada','Com Relatório','Fechada'].includes(r.estado)
  );

  // Construir linhas de faturação (cada pedido pode ter 1 ou 2 linhas, conforme estado)
  const linhas = [];
  data.forEach(r => {
    // Tranche 1 — sempre que está adjudicado
    linhas.push({
      pedido: r,
      tranche: 1,
      label: 'T1 — Adjudicação',
      valor: r.fat1_valor,
      enviada: r.fat1_enviada,
      pago: r.fat1_pago
    });
    // Tranche 2 — só quando passou para Com Relatório ou Fechada
    if (['Com Relatório','Fechada'].includes(r.estado)) {
      linhas.push({
        pedido: r,
        tranche: 2,
        label: 'T2 — Relatório',
        valor: r.fat2_valor,
        enviada: r.fat2_enviada,
        pago: r.fat2_pago
      });
    }
  });

  // KPIs
  const totalAFaturar = linhas.filter(l => !l.enviada).reduce((s, l) => s + (Number(l.valor) || 0), 0);
  const totalFaturado = linhas.filter(l => l.enviada).reduce((s, l) => s + (Number(l.valor) || 0), 0);
  const totalPorReceber = linhas.filter(l => l.enviada && !l.pago).reduce((s, l) => s + (Number(l.valor) || 0), 0);
  const totalRecebido = linhas.filter(l => l.pago).reduce((s, l) => s + (Number(l.valor) || 0), 0);

  // Filtros simples
  const filtro = state.filters.financeiro || (state.filters.financeiro = { estado: '' });
  let linhasView = linhas;
  if (filtro.estado === 'por_faturar') linhasView = linhas.filter(l => !l.enviada);
  else if (filtro.estado === 'faturado_por_pagar') linhasView = linhas.filter(l => l.enviada && !l.pago);
  else if (filtro.estado === 'pago') linhasView = linhas.filter(l => l.pago);

  $('#section-inspect').innerHTML = `
    <div class="page-header">
      <div>
        <div class="page-title">Aceitar Inspect — Financeiro</div>
        <div class="page-subtitle">${linhas.length} tranches · ${linhasView.length} visíveis</div>
      </div>
      <div class="page-actions">
        <div class="tabs">
          <button class="tab-btn" onclick="switchInspectView('listagem')">Listagem</button>
          ${isAdmin() ? `<button class="tab-btn" onclick="switchInspectView('duplicados')">Duplicados</button>` : ''}
          <button class="tab-btn active" onclick="switchInspectView('financeiro')">Financeiro</button>
          <button class="tab-btn" onclick="switchInspectView('analise')">Análise</button>

async function markFinanceiro(pedidoId, tranche, tipo) {
  const today = new Date().toISOString().slice(0,10);
  const date = prompt(tipo === 'enviada' ? 'Data da fatura enviada:' : 'Data do pagamento recebido:', today);
  if (!date) return;
  const field = `fat${tranche}_${tipo === 'enviada' ? 'enviada' : 'pago'}`;
  const { error } = await sb.from('inspect_pedidos').update({ [field]: date }).eq('id', pedidoId);
  if (error) { showToast('Erro: ' + error.message, 'error'); return; }
  await reloadTable('inspect');
  renderInspect();
  showToast(tipo === 'enviada' ? 'Fatura marcada como enviada' : 'Pagamento registado', 'success');
}

// ============================================================
// ACEITAR INSPECT — VISTA DE ANÁLISE
// ============================================================
// Identifica grupos de pedidos *exatamente iguais* em 6 campos-chave
// (referência + cliente + data_pedido + tipo_servico + valor_sem_iva + localizacao)
// Para cada grupo mantém o mais antigo (created_at asc) e devolve os IDs a apagar.
function calcularDuplicadosExatos() {
  const norm = s => (s ?? '').toString().trim().toLowerCase();
  const numKey = v => v == null || v === '' ? '' : String(Number(v));
  const dateKey = v => v ? new Date(v).toISOString().slice(0,10) : '';
  const keyOf = r => [
    norm(r.referencia),
    norm(r.cliente),
    dateKey(r.data_pedido),
    norm(r.tipo_servico),
    numKey(r.valor_sem_iva),
    norm(r.localizacao)
  ].join('|');

  const grupos = {};
  state.data.inspect.forEach(r => {
    const k = keyOf(r);
    // ignora linhas sem refer e sem cliente (chave demasiado vazia)
    if (!r.referencia && !r.cliente) return;
    (grupos[k] = grupos[k] || []).push(r);
  });

  const aApagar = [];
  const grupoCount = [];
  Object.values(grupos).forEach(arr => {
    if (arr.length < 2) return;
    // ordenar por created_at asc; o mais antigo fica
    arr.sort((a,b) => new Date(a.created_at || 0) - new Date(b.created_at || 0));
    grupoCount.push(arr);
    arr.slice(1).forEach(r => aApagar.push(r));
  });
  return { grupos: grupoCount, aApagar };
}

async function limparDuplicadosExatos() {
  const { grupos, aApagar } = calcularDuplicadosExatos();
  if (aApagar.length === 0) {
    showToast('Não há duplicados exatos para apagar', '');
    return;
  }

  const linhas = aApagar.slice(0, 15).map(r =>
    `<tr><td>${r.id_pedido || '—'}</td><td>${escapeHtml(r.referencia) || '—'}</td><td>${escapeHtml(r.cliente)}</td><td>${fmtDate(r.data_pedido)}</td><td>${fmtCurrency(r.valor_sem_iva)}</td></tr>`
  ).join('');
  const extra = aApagar.length > 15 ? `<tr><td colspan="5" class="text-small text-muted">... e mais ${aApagar.length - 15}</td></tr>` : '';

  showModal(`
    <div class="modal-header">
      <div class="modal-title">Limpar duplicados exatos</div>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body">
      <p>Encontrados <strong>${grupos.length}</strong> grupos com pedidos exatamente iguais nos 6 campos-chave (referência + cliente + data_pedido + tipo_servico + valor_sem_iva + localizacao).</p>
      <p>Vai apagar <strong style="color:var(--danger)">${aApagar.length} pedidos</strong>. De cada grupo mantém-se o <strong>mais antigo</strong>.</p>
      <p class="text-small text-muted">Os anexos no Storage destes pedidos também serão apagados.</p>
      <div class="table-wrapper" style="max-height:300px;overflow-y:auto;margin-top:12px">
        <table class="data-table">
          <thead><tr><th>ID</th><th>Referência</th><th>Cliente</th><th>Data</th><th class="num">Valor</th></tr></thead>
          <tbody>${linhas}${extra}</tbody>
        </table>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-danger" id="btn-confirmar-limpar">Continuar →</button>
    </div>
  `, 'lg');

  $('#btn-confirmar-limpar').onclick = async () => {
    const confirmText = prompt(`Para confirmar a eliminação de ${aApagar.length} pedidos, escreve APAGAR em maiúsculas:`);
    if (confirmText !== 'APAGAR') { showToast('Cancelado', ''); return; }
    closeModal();

    let okBD = 0, okStorage = 0, erros = 0;
    const ids = aApagar.map(r => r.id);

    // 1) Apagar anexos no Storage (descobrir paths via inspect_anexos)
    const { data: anexos } = await sb.from('inspect_anexos').select('storage_path').in('pedido_id', ids);
    if (anexos && anexos.length) {
      const paths = anexos.map(a => a.storage_path).filter(Boolean);
      if (paths.length) {
        const { error: stErr } = await sb.storage.from('inspect-anexos').remove(paths);
        if (!stErr) okStorage = paths.length;
      }
      // apagar registos em inspect_anexos
      await sb.from('inspect_anexos').delete().in('pedido_id', ids);
    }

    // 2) Apagar pedidos em chunks (Postgres in() lida bem, mas por segurança em 200)
    const chunkSize = 200;
    for (let i = 0; i < ids.length; i += chunkSize) {
      const chunk = ids.slice(i, i + chunkSize);
      const { error } = await sb.from('inspect_pedidos').delete().in('id', chunk);
      if (error) erros += chunk.length;
      else okBD += chunk.length;
    }

    await reloadTable('inspect');
    renderInspect();
    showToast(`Apagados ${okBD} pedidos${okStorage ? ` + ${okStorage} anexos` : ''}${erros ? ` · ${erros} erros` : ''}`, erros ? 'error' : 'success');
  };
}

// Renumera todos os id_pedido no formato 2026-MM-0000
// ============================================================
// IDFic — chave fictícia para matching durante imports manuais
// ============================================================
async function atribuirIDFic() {
  const rows = [...state.data.inspect];
  if (rows.length === 0) { showToast('Sem pedidos para numerar', ''); return; }

  // ordenar por data_pedido asc (fallback created_at) — consistente com a listagem
  const dateOf = r => r.data_pedido || (r.created_at ? r.created_at.slice(0,10) : '9999-12-31');
  rows.sort((a, b) => {
    const da = dateOf(a), db = dateOf(b);
    if (da !== db) return da < db ? -1 : 1;
    return (a.created_at || '') < (b.created_at || '') ? -1 : 1;
  });

  const total = rows.length;
  const semIDFic = rows.filter(r => r.idfic == null).length;
  const comIDFic = total - semIDFic;

  showModal(`
    <div class="modal-header">
      <div class="modal-title">Atribuir IDFic</div>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body">
      <p>Vai atribuir IDFic sequencial (1, 2, 3, ...) a <strong>${total}</strong> pedidos, ordenados por data.</p>
      <p class="text-small">Estado atual: ${comIDFic} com IDFic · ${semIDFic} sem IDFic. Esta ação <strong>sobrescreve todos</strong>.</p>
      <p class="text-small text-muted">Nada mais é alterado. id_pedido, anexos, valores — tudo intacto.</p>
      <p class="text-small" style="color:#92400e;background:#fffbeb;padding:8px 12px;border-radius:4px;border:1px solid #fde68a">
        💡 Depois desta operação: Export XLSX → no Excel preenches a coluna ID Pedido (mantendo a coluna IDFic) → usar "🔄 Atualizar ID Pedido".
      </p>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" id="btn-conf-idfic">Atribuir agora</button>
    </div>
  `, 'sm');

  $('#btn-conf-idfic').onclick = async () => {
    closeModal();
    let ok = 0, erros = 0;
    for (let i = 0; i < rows.length; i++) {
      const novoIDFic = i + 1;
      const { error } = await sb.from('inspect_pedidos').update({ idfic: novoIDFic }).eq('id', rows[i].id);
      if (error) { erros++; console.error(error); } else ok++;
    }
    await reloadTable('inspect');
    renderInspect();
    showToast(`Atribuídos ${ok} IDFic${erros ? ` · ${erros} erros` : ''}`, erros ? 'error' : 'success');
  };
}

async function atualizarIdPedidoPorExcel() {
  // ler ficheiro Excel do utilizador
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.xlsx,.xls';
  input.onchange = async e => {
    const file = e.target.files[0];
    if (!file) return;

    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type: 'array' });
    const ws = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws, { defval: '' });

    if (rows.length === 0) { showToast('Excel vazio', 'error'); return; }

    // detetar colunas (aceita variações)
    const sample = Object.keys(rows[0]);
    const colIDFic = sample.find(k => /^idfic$/i.test(k.trim()) || /^id\s*fic/i.test(k.trim()));
    const colIdPedido = sample.find(k => /^id\s*pedido$/i.test(k.trim()) || /^id$/i.test(k.trim()));

    if (!colIDFic || !colIdPedido) {
      showToast(`Faltam colunas. Encontradas: ${sample.join(', ')}. Esperadas: "IDFic" e "ID Pedido".`, 'error');
      return;
    }

    // construir mapa idfic -> novoIdPedido a partir do Excel
    const mapa = {};
    rows.forEach(r => {
      const idfic = parseInt(r[colIDFic]);
      const novoId = (r[colIdPedido] ?? '').toString().trim();
      if (!isNaN(idfic) && novoId) mapa[idfic] = novoId;
    });

    // comparar com a BD e calcular o que muda
    const inspectByIDFic = {};
    state.data.inspect.forEach(r => { if (r.idfic != null) inspectByIDFic[r.idfic] = r; });

    const updates = [];
    const naoEncontrados = [];
    Object.entries(mapa).forEach(([idfic, novoId]) => {
      const r = inspectByIDFic[parseInt(idfic)];
      if (!r) { naoEncontrados.push(idfic); return; }
      if (r.id_pedido !== novoId) updates.push({ id: r.id, idfic: parseInt(idfic), antigoId: r.id_pedido, novoId });
    });

    if (updates.length === 0) {
      showToast(`Nada para atualizar (${naoEncontrados.length} IDFic do Excel não estão na BD).`, '');
      return;
    }

    // verificar duplicados no novo id_pedido
    const novosIds = updates.map(u => u.novoId);
    const setIds = new Set(novosIds);
    const haDuplicadosNovos = setIds.size !== novosIds.length;

    const preview = updates.slice(0, 20).map(u =>
      `<tr><td>${u.idfic}</td><td>${escapeHtml(u.antigoId) || '(vazio)'}</td><td style="color:var(--success);font-weight:600">${escapeHtml(u.novoId)}</td></tr>`
    ).join('');
    const extra = updates.length > 20 ? `<tr><td colspan="3" class="text-small text-muted">... e mais ${updates.length - 20}</td></tr>` : '';

    showModal(`
      <div class="modal-header">
        <div class="modal-title">Atualizar ID Pedido por Excel</div>
        <button class="modal-close" onclick="closeModal()">×</button>
      </div>
      <div class="modal-body">
        <p>Excel: <strong>${rows.length}</strong> linhas válidas. Vão ser atualizados <strong>${updates.length}</strong> pedidos.</p>
        ${naoEncontrados.length ? `<p class="text-small" style="color:var(--danger)">⚠ ${naoEncontrados.length} IDFic do Excel não foram encontrados na BD.</p>` : ''}
        ${haDuplicadosNovos ? `<p class="text-small" style="color:var(--danger)">⚠ Há valores duplicados na coluna "ID Pedido" do Excel. A operação pode falhar se houver UNIQUE constraint.</p>` : ''}
        <p class="text-small text-muted">Só é atualizado o campo id_pedido. Nada mais é tocado.</p>
        <div class="table-wrapper" style="max-height:340px;overflow-y:auto;margin-top:12px">
          <table class="data-table">
            <thead><tr><th>IDFic</th><th>Antigo ID</th><th>Novo ID</th></tr></thead>
            <tbody>${preview}${extra}</tbody>
          </table>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
        <button class="btn btn-primary" id="btn-conf-upd">Atualizar ${updates.length}</button>
      </div>
    `, 'lg');

    $('#btn-conf-upd').onclick = async () => {
      closeModal();
      let ok = 0, erros = 0;
      const errosDetalhe = [];
      for (const u of updates) {
        const { error } = await sb.from('inspect_pedidos').update({ id_pedido: u.novoId }).eq('id', u.id);
        if (error) { erros++; errosDetalhe.push(`IDFic ${u.idfic}: ${error.message}`); }
        else ok++;
      }
      await reloadTable('inspect');
      renderInspect();
      if (erros > 0) console.error('Erros:', errosDetalhe);
      showToast(`Atualizados ${ok} pedidos${erros ? ` · ${erros} erros (ver consola)` : ''}`, erros ? 'error' : 'success');
    };
  };
  input.click();
}

function renderInspectDuplicados() {

    if (rCli) (porCliente[rCli] = porCliente[rCli] || []).push(r);
