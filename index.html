// ---------- MAP ----------
function initInspectMap() {
  const mapEl = $('#mapa-inspect');
  if (!mapEl) return;

  // Portugal bounds default
  const map = L.map(mapEl).setView([39.5, -8.0], 7);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap',
    maxZoom: 19
  }).addTo(map);

  state.map = map;

  const withCoords = state.data.inspect.filter(r => r.latitude && r.longitude);
  if (withCoords.length === 0) return;

  const cluster = L.markerClusterGroup();
  withCoords.forEach(r => {
    const marker = L.marker([r.latitude, r.longitude]);
    const popupHTML = `
      <strong>${escapeHtml(r.cliente || '(sem cliente)')}</strong><br>
      ${r.id_pedido ? escapeHtml(r.id_pedido) + '<br>' : ''}
      ${escapeHtml(r.localizacao || r.morada || '')}<br>
      ${fmtCurrency(r.valor_sem_iva)} · ${r.estado || ''}<br>
      <a href="#" onclick="closePopupAndOpenInspect('${r.id}');return false;">Ver detalhes →</a>
    `;
    marker.bindPopup(popupHTML);
    cluster.addLayer(marker);
  });
  map.addLayer(cluster);

  const bounds = L.latLngBounds(withCoords.map(r => [r.latitude, r.longitude]));
  map.fitBounds(bounds, { padding: [30, 30], maxZoom: 13 });
}

function closePopupAndOpenInspect(id) {
  if (state.map) state.map.closePopup();
  openInspectDetail(id);
}

// ---------- GEOCODING (Nominatim) ----------
async function geocodeAddress(query) {
  if (!query || !query.trim()) return null;
  const url = 'https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=pt&q=' + encodeURIComponent(query);
  try {
    const resp = await fetch(url, { headers: { 'Accept': 'application/json' } });
    if (!resp.ok) return null;
    const results = await resp.json();
    if (results && results.length > 0) {
      return {
        lat: parseFloat(results[0].lat),
        lon: parseFloat(results[0].lon)
      };
    }
  } catch (e) {
    console.warn('Geocode falhou:', e);
  }
  return null;
}

async function geocodeAllInspect() {
  const pending = state.data.inspect.filter(r =>
    (r.localizacao || r.morada) && (!r.latitude || !r.longitude)
  );
  if (pending.length === 0) {
    showToast('Nada para geocodificar', 'success');
    return;
  }
  if (!confirm('Vai geocodificar ' + pending.length + ' registos. Isto demora ~' + pending.length + ' segundos (limite de 1 pedido/seg do OpenStreetMap). Continuar?')) return;

  showToast('A geocodificar ' + pending.length + ' registos...', '');
  let ok = 0, fail = 0;
  for (const r of pending) {
    const query = [r.morada, r.localizacao].filter(Boolean).join(', ');
    const coords = await geocodeAddress(query);
    if (coords) {
      await sb.from('inspect_pedidos').update({
        latitude: coords.lat,
        longitude: coords.lon,
        geocoded_at: new Date().toISOString()
      }).eq('id', r.id);
      ok++;
    } else {
      fail++;
    }
    // Rate limit Nominatim: max 1 req/sec
    await new Promise(res => setTimeout(res, 1100));
  }
  showToast('Geocodificado: ' + ok + ' ok, ' + fail + ' falhas', 'success');
  await reloadTable('inspect');
  renderInspect();
}

// ---------- AI GLOBAL INSIGHTS ----------
async function runAnalysisInspectGlobal() {
  const panel = $('#ia-insights-inspect');
  panel.innerHTML = `<h4>Insights IA</h4><div class="ia-loading"><div class="spinner"></div>A analisar...</div>`;

  // Agregar dados para enviar ao Claude
  const data = state.data.inspect;
  const totalOrc = data.reduce((s, r) => s + (Number(r.valor_sem_iva) || 0), 0);
  const adjArr = data.filter(r => ['Adjudicada','Agendada','Realizada','Com Relatório','Fechada'].includes(r.estado));
  const valAdj = adjArr.reduce((s, r) => s + (Number(r.valor_sem_iva) || 0), 0);
  const pipeArr = data.filter(r => ['Em Aberto','Pendente','Enviada'].includes(r.estado));
  const valPipe = pipeArr.reduce((s, r) => s + (Number(r.valor_sem_iva) || 0), 0);
  const aceites = adjArr.length;
  const rejeitadas = data.filter(r => r.estado === 'Não Adjudicada').length;
  const decididas = aceites + rejeitadas;
  const taxa = decididas > 0 ? (aceites / decididas * 100) : 0;

  const porEstado = {};
  data.forEach(r => { porEstado[r.estado] = (porEstado[r.estado]||0)+1; });

  const porTipo = {};
  data.forEach(r => {
    const t = r.tipo_servico || '(n/d)';
    porTipo[t] = porTipo[t] || { count: 0, valor: 0 };
    porTipo[t].count++;
    porTipo[t].valor += Number(r.valor_sem_iva) || 0;
  });

  const porCanal = {};
  data.forEach(r => {
    const c = r.canal_origem || '(n/d)';
    porCanal[c] = porCanal[c] || { count: 0, aceites: 0 };
    porCanal[c].count++;
    if (['Adjudicada','Agendada','Realizada','Com Relatório','Fechada'].includes(r.estado)) porCanal[c].aceites++;
  });

  const agregados = {
    total_propostas: data.length,
    total_orcamentado_eur: Math.round(totalOrc),
    valor_adjudicado_eur: Math.round(valAdj),
    valor_pipeline_eur: Math.round(valPipe),
    aceites: aceites, rejeitadas: rejeitadas,
    taxa_conversao_pct: Number(taxa.toFixed(1)),
    ticket_medio_adjudicado_eur: aceites > 0 ? Math.round(valAdj / aceites) : 0,
    por_estado: porEstado,
    por_tipo_servico: porTipo,
    por_canal: porCanal
  };

  try {
    const resp = await fetch('/api/analisar', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ type: 'inspect_global', record: agregados })
    });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const d = await resp.json();
    panel.innerHTML = `
      <h4>Insights IA</h4>
      <div class="ia-content">${escapeHtml(d.analysis)}</div>
      <div class="ia-meta">Gerada em ${fmtDateTime(new Date().toISOString())}</div>
      <div class="mt"><button class="btn btn-secondary btn-sm" onclick="runAnalysisInspectGlobal()">🔄 Regenerar</button></div>
    `;
  } catch (e) {
    panel.innerHTML = `<h4>Insights IA</h4><div style="color:var(--danger)">${escapeHtml(e.message)}</div>
      <div class="mt"><button class="btn btn-gold btn-sm" onclick="runAnalysisInspectGlobal()">Tentar novamente</button></div>`;
  }
}

async function saveInspect(id) {
  const form = $('#form-inspect');
  const fd = new FormData(form);
  const rec = {};
  fd.forEach((v, k) => { rec[k] = v === '' ? null : v; });
  if (!rec.cliente || !rec.data_pedido) {
    showToast('Cliente e Data Pedido são obrigatórios', 'error');
    return;
  }
  if (rec.valor_sem_iva) rec.valor_sem_iva = parseFloat(rec.valor_sem_iva);
  if (rec.valor_adjudicado) rec.valor_adjudicado = parseFloat(rec.valor_adjudicado);
  if (rec.fat1_valor) rec.fat1_valor = parseFloat(rec.fat1_valor);
  if (rec.fat2_valor) rec.fat2_valor = parseFloat(rec.fat2_valor);
  if (rec.custo) rec.custo = parseFloat(rec.custo);

  // Auto-geocode if editing with changed address or creating new with address
  const existing = id ? state.data.inspect.find(x => x.id === id) : null;
  const addressChanged = !existing ||
    existing.localizacao !== rec.localizacao ||
    existing.morada !== rec.morada;
  const hasAddress = rec.localizacao || rec.morada;

  if (hasAddress && addressChanged) {
    const query = [rec.morada, rec.localizacao].filter(Boolean).join(', ');
    const coords = await geocodeAddress(query);
    if (coords) {
      rec.latitude = coords.lat;
      rec.longitude = coords.lon;
      rec.geocoded_at = new Date().toISOString();
    }
  }

  let error;
  if (id) {
    ({ error } = await sb.from('inspect_pedidos').update(rec).eq('id', id));
  } else {
    rec.criado_por = null;
    if (!rec.data_abertura) rec.data_abertura = rec.data_pedido || new Date().toISOString().slice(0,10);
    if (!rec.estado) rec.estado = 'Em Aberto';
    ({ error } = await sb.from('inspect_pedidos').insert(rec));
  }
  if (error) { showToast('Erro: ' + error.message, 'error'); return; }
  closeModal();
  await reloadTable('inspect');
  renderInspect();
  showToast(id ? 'Pedido atualizado' : 'Pedido criado', 'success');
}

function deleteInspect(id) {
  const r = state.data.inspect.find(x => x.id === id);
  confirmAction('Eliminar o pedido de "' + (r?.cliente || '—') + '"?', async () => {
    const { error } = await sb.from('inspect_pedidos').delete().eq('id', id);
    if (error) { showToast('Erro: ' + error.message, 'error'); return; }
    await reloadTable('inspect');
    renderInspect();
    showToast('Pedido eliminado', 'success');
  });
}

// Mapa de reversão de estados (só superadmin)
// para = estado anterior; clear = campos a limpar (data + outros opcionais)
const INSPECT_REVERT_MAP = {
  'Pendente':        { para: 'Em Aberto',  clear: ['data_pendente'] },
  'Enviada':         { para: 'Em Aberto',  clear: ['data_envio'] },
  'Adjudicada':      { para: 'Enviada',    clear: ['data_adjudicacao'] },
  'Não Adjudicada':  { para: 'Enviada',    clear: ['data_nao_adjudicacao','motivo_nao_adjudicacao'] },
  'Agendada':        { para: 'Adjudicada', clear: ['data_agendada'] },
  'Realizada':       { para: 'Agendada',   clear: ['data_realizacao','data_inspecao'] },
  'Com Relatório':   { para: 'Realizada',  clear: ['data_relatorio'] },
  'Fechada':         { para: 'Com Relatório', clear: ['data_fechado'] },
  'Cancelada':       { para: 'Em Aberto',  clear: ['data_cancelado'] }
};

async function reverterEstadoInspect(id) {
  const r = state.data.inspect.find(x => x.id === id);
  if (!r) return;
  const map = INSPECT_REVERT_MAP[r.estado];
  if (!map) { showToast('Não é possível reverter este estado', 'error'); return; }

  const msg = `Reverter de "${r.estado}" para "${map.para}"?\n\nVai limpar: ${map.clear.join(', ')}.\n\nOs valores (€) e anexos mantêm-se.`;
  if (!confirm(msg)) return;

  const update = { estado: map.para };
  map.clear.forEach(f => { update[f] = null; });

  const { error } = await sb.from('inspect_pedidos').update(update).eq('id', id);
  if (error) { showToast('Erro: ' + error.message, 'error'); return; }
  await reloadTable('inspect');
  closeModal();
  openInspectDetail(id);
  showToast(`Estado revertido para ${map.para}`, 'success');
}

async function openInspectDetail(id) {
  const r = state.data.inspect.find(x => x.id === id);
  if (!r) return;

  // Carregar anexos
  const { data: anexos } = await sb.from('inspect_anexos')
    .select('*').eq('pedido_id', id).order('created_at', { ascending: false });

  const transicoesPossiveis = CONFIG.INSPECT_WORKFLOW[r.estado] || [];

  // Anexos visíveis em: Em Aberto, Pendente, Adjudicada (e Com Relatório para o relatório)
  const podeAnexarGenerico = ['Em Aberto', 'Pendente', 'Enviada', 'Adjudicada'].includes(r.estado);
  const podeAnexarRelatorio = r.estado === 'Com Relatório';
  const mostraAnexos = podeAnexarGenerico || podeAnexarRelatorio || (anexos && anexos.length > 0);

  // Workflow stepper
  const ordemEstados = ['Em Aberto','Pendente','Enviada','Adjudicada','Agendada','Realizada','Com Relatório','Fechada'];
  const isCancelado = r.estado === 'Cancelada';
  const isNaoAdj = r.estado === 'Não Adjudicada';
  const idxAtual = ordemEstados.indexOf(r.estado);

  const stepperHTML = ordemEstados.map((estado, i) => {
    let cls = 'workflow-step';
    if (isCancelado) cls += ' cancelled';
    else if (estado === r.estado) cls += ' active';
    else if (idxAtual >= 0 && i < idxAtual) cls += ' done';
    return `<span class="${cls}">${estado}</span>` + (i < ordemEstados.length - 1 ? '<span class="workflow-arrow">→</span>' : '');
  }).join('');

  showModal(`
    <div class="modal-header">
      <div>
        <div class="modal-title">${escapeHtml(r.cliente)}</div>
        ${r.id_pedido ? `<div class="text-small text-muted">${escapeHtml(r.id_pedido)}</div>` : ''}
      </div>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body">

      <!-- Workflow stepper -->
      <div class="workflow-bar">
        ${isCancelado ? `<span class="workflow-step cancelled">Cancelada</span>` : ''}
        ${isNaoAdj ? `<span class="workflow-step cancelled">Não Adjudicada</span>` : ''}
        ${!isCancelado && !isNaoAdj ? stepperHTML : ''}
      </div>

      ${canEdit() && transicoesPossiveis.length > 0 ? `
        <div class="workflow-actions">
          ${transicoesPossiveis.map(t => `
            <button class="btn ${t.danger ? 'btn-secondary' : 'btn-primary'} btn-sm"
                    onclick='openTransitionModal(${JSON.stringify(id)}, ${JSON.stringify(t)})'>
              ${escapeHtml(t.label)}
            </button>
          `).join('')}
        </div>
      ` : ''}

      ${isAdmin() && INSPECT_REVERT_MAP[r.estado] ? `
        <div style="margin: 8px 0 16px">
          <button class="btn btn-ghost btn-sm" style="color:var(--danger)"
                  onclick="reverterEstadoInspect('${id}')"
                  title="Voltar ao estado anterior (apenas superadmin)">
            ↶ Reverter estado para "${INSPECT_REVERT_MAP[r.estado].para}"
          </button>
        </div>
      ` : ''}

      <!-- Dados -->
      <div class="form-row-3 mb-lg">
        <div><label class="text-small text-muted">ID</label><div>${r.id_pedido ? escapeHtml(r.id_pedido) : '—'}</div></div>
        <div><label class="text-small text-muted">Referência</label><div>${r.referencia ? escapeHtml(r.referencia) : '—'}</div></div>
        <div><label class="text-small text-muted">Estado</label><div>${badge(r.estado)}</div></div>
        <div><label class="text-small text-muted">Cliente</label><div>${r.cliente ? escapeHtml(r.cliente) : '—'}</div></div>
        <div><label class="text-small text-muted">Email</label><div>${r.email ? escapeHtml(r.email) : '—'}</div></div>
        <div><label class="text-small text-muted">Telefone</label><div>${r.telefone ? escapeHtml(r.telefone) : '—'}</div></div>
        <div><label class="text-small text-muted">Localização</label><div>${r.localizacao ? escapeHtml(r.localizacao) : '—'}</div></div>
        <div style="grid-column: span 3"><label class="text-small text-muted">Morada</label><div>${r.morada ? escapeHtml(r.morada) : '—'}</div></div>
        <div><label class="text-small text-muted">Tipo Serviço</label><div>${r.tipo_servico ? escapeHtml(r.tipo_servico) : '—'}</div></div>
        <div><label class="text-small text-muted">Valor s/ IVA</label><div>${fmtCurrency(r.valor_sem_iva)}</div></div>

async function notifyFinanceiro(pedido, fase, dataTransicao, detalhes) {

    const params = {

      cc_emails: 'tiago.faria@aceitar.pt; carlos.ferreira@aceitar.pt',

// ---------- WORKFLOW TRANSITIONS ----------
function openTransitionModal(id, transicao) {
  const today = new Date().toISOString().slice(0,10);

  // Suporte para formato antigo (extra) e novo (extras)
  const extras = transicao.extras || (transicao.extra ? [transicao.extra] : []);

  const extrasHTML = extras.map((ex, i) => {
    if (ex.type === 'file') {
      return `
        <div class="form-group">
          <label>${ex.label}</label>
          <input type="file" class="form-control" id="extra-${i}" style="padding:6px">
          <div class="text-small text-muted" style="margin-top:4px">Opcional. Máx 25 MB.</div>
        </div>`;
    }
    if (ex.type === 'select') {
      const opts = (ex.options || []).map(o => `<option value="${escapeHtml(o)}">${escapeHtml(o)}</option>`).join('');
      return `
        <div class="form-group">
          <label>${ex.label} <span class="required">*</span></label>
          <select class="form-control" id="extra-${i}">
            <option value="">Selecionar...</option>
            ${opts}
          </select>
        </div>`;
    }
    if (ex.type === 'number') {
      const reg = state.data.inspect.find(p => p.id === id);
      let initialValue = null;
      if (ex.defaultFrom) {
        initialValue = reg?.[ex.defaultFrom];
      } else if (ex.defaultPercent) {
        // Calculado em runtime após "valor_adjudicado_input" estar preenchido (caso seja a tranche 1)
        // Para tranche 2: usa valor_adjudicado já guardado
        if (ex.defaultPercent.from === 'valor_adjudicado_input') {
          // tranche 1 — calculado dinamicamente após tipar valor_adjudicado
          initialValue = null;
        } else {
          const base = reg?.[ex.defaultPercent.from];
          if (base) initialValue = (Number(base) * ex.defaultPercent.percent / 100).toFixed(2);
        }
      }
      const valAttr = (initialValue !== undefined && initialValue !== null) ? `value="${initialValue}"` : '';
      const dataAttrs = ex.defaultPercent ? `data-defpercent="${ex.defaultPercent.percent}" data-defpercent-from="${ex.defaultPercent.from}"` : '';
      return `
        <div class="form-group">
          <label>${ex.label} <span class="required">*</span></label>
          <input type="number" step="0.01" class="form-control" id="extra-${i}" ${valAttr} ${dataAttrs} placeholder="0,00">
        </div>`;
    }
    if (ex.type === 'textarea') {
      return `
        <div class="form-group">
          <label>${ex.label}</label>
          <textarea class="form-control" id="extra-${i}" rows="3" style="min-height:70px"></textarea>
        </div>`;
    }
    // date (default)
    return `
      <div class="form-group">
        <label>${ex.label} <span class="required">*</span></label>
        <input type="date" class="form-control" id="extra-${i}" value="${today}">
      </div>`;
  }).join('');

  showModal(`
    <div class="modal-header">
      <div class="modal-title">${escapeHtml(transicao.label)}</div>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body">
      <form id="transition-form" onsubmit="event.preventDefault(); return false;">
      <div class="form-group">
        <label>${transicao.dataLabel} <span class="required">*</span></label>
        <input type="date" class="form-control" id="transition-date" value="${today}">
      </div>
      ${extrasHTML}
      </form>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
      <button class="btn ${transicao.danger ? 'btn-danger' : 'btn-primary'}" id="confirm-transition">Confirmar</button>
    </div>
  `, 'sm');

  // Auto-calcular campos com defaultPercent dependentes de outros inputs
  // (ex: tranche 1 = 50% do valor adjudicado)
  extras.forEach((ex, i) => {
    if (ex.field === 'valor_adjudicado') {
      const sourceEl = $('#extra-' + i);
      if (sourceEl) {
        sourceEl.addEventListener('input', () => {
          extras.forEach((ex2, j) => {
            if (ex2.defaultPercent && ex2.defaultPercent.from === 'valor_adjudicado_input') {
              const dep = $('#extra-' + j);
              if (dep && !dep.dataset.touched) {
                const v = parseFloat(sourceEl.value);
                if (!isNaN(v)) dep.value = (v * ex2.defaultPercent.percent / 100).toFixed(2);
              }
            }
          });
        });
      }
    }
    // Marcar campo como "touched" se utilizador editar manualmente
    const el = $('#extra-' + i);
    if (el && ex.type === 'number') {
      el.addEventListener('change', () => { el.dataset.touched = '1'; });
    }
  });

  $('#confirm-transition').onclick = async () => {
    const dateValue = $('#transition-date').value;
    if (!dateValue) { showToast('Data obrigatória', 'error'); return; }

    const update = {
      estado: transicao.para,
      [transicao.dataField]: dateValue
    };

    // Recolher extras (exceto files, que são tratados separadamente)
    const filesToUpload = [];
    for (let i = 0; i < extras.length; i++) {
      const ex = extras[i];
      const el = $('#extra-' + i);
      if (ex.type === 'file') {
        if (el.files && el.files[0]) {
          if (el.files[0].size > 25 * 1024 * 1024) {
            showToast('Ficheiro demasiado grande (máx 25 MB)', 'error');
            return;
          }
          filesToUpload.push({ field: ex.field, file: el.files[0], label: ex.label, tipoAnexo: ex.tipoAnexo || 'generico' });
        }
        // Se não há ficheiro, apenas não adiciona — é opcional
      } else if (ex.type === 'number') {
        const raw = el.value;
        if (!raw) { showToast(ex.label + ' obrigatório', 'error'); return; }
        update[ex.field] = parseFloat(raw);
      } else if (ex.type === 'textarea') {
        update[ex.field] = el.value || null;
      } else {
        const raw = el.value;
        if (!raw) { showToast(ex.label + ' obrigatória', 'error'); return; }
        update[ex.field] = raw;
      }
    }

    // 1. Atualiza estado/dados na BD
    const btn = $('#confirm-transition');
    btn.disabled = true;
    btn.textContent = 'A guardar...';
    const { error } = await sb.from('inspect_pedidos').update(update).eq('id', id);
    if (error) { showToast('Erro: ' + error.message, 'error'); btn.disabled = false; btn.textContent = 'Confirmar'; return; }

    // 2. Faz upload dos ficheiros
    for (const item of filesToUpload) {
      btn.textContent = 'A enviar ' + item.file.name + '...';
      const path = id + '/' + Date.now() + '_' + item.file.name.replace(/[^a-zA-Z0-9._-]/g, '_');
      const { error: upErr } = await sb.storage.from('inspect-anexos').upload(path, item.file, {
        contentType: item.file.type,
        upsert: false
      });
      if (upErr) {
        showToast('Aviso: anexo "' + item.file.name + '" falhou: ' + upErr.message, 'error');
        continue;
      }
      const { error: dbErr } = await sb.from('inspect_anexos').insert({
        pedido_id: id,
        tipo: item.tipoAnexo || 'generico',
        nome: item.file.name,
        storage_path: path,
        tamanho_bytes: item.file.size,
        mime_type: item.file.type
      });
      if (dbErr) {
        await sb.storage.from('inspect-anexos').remove([path]);
        showToast('Aviso: BD do anexo falhou: ' + dbErr.message, 'error');
      }
    }

    closeModal();
    await reloadTable('inspect');
    renderInspect();
    openInspectDetail(id);
    showToast('Estado atualizado para ' + transicao.para, 'success');

    // Notificar financeiro se a transição tiver fase configurada
    if (transicao.notify) {
      const updated = state.data.inspect.find(p => p.id === id);
      if (updated) {
        let detalhes = '';
        if (transicao.notify === 'Adjudicação Efetuada') {
          detalhes = 'Tranche 1 (50%): ' + fmtCurrency(updated.fat1_valor || 0);
          if (!updated.fat_nome) {
            detalhes += '\n\n⚠️ ATENÇÃO: faltam preencher os dados de faturação no separador "Faturação".';
          }
        } else if (transicao.notify === 'Relatório Entregue') {
          detalhes = 'Tranche 2 (50%): ' + fmtCurrency(updated.fat2_valor || 0);
        }
        notifyFinanceiro(updated, transicao.notify, dateValue, detalhes);
      }
    }
  };
}

// ---------- ANEXOS ----------
function fmtBytes(b) {
  if (!b) return '—';
  if (b < 1024) return b + ' B';
  if (b < 1024*1024) return (b/1024).toFixed(1) + ' KB';
  return (b/1024/1024).toFixed(1) + ' MB';
}

function iconForMime(mime, nome) {
  const ext = (nome || '').split('.').pop().toLowerCase();
  if ((mime || '').startsWith('image/') || ['jpg','jpeg','png','gif','webp'].includes(ext)) return '🖼️';
  if (mime === 'application/pdf' || ext === 'pdf') return '📕';
  if (['doc','docx'].includes(ext)) return '📘';
  if (['xls','xlsx','csv'].includes(ext)) return '📗';
  if (['zip','rar','7z'].includes(ext)) return '🗜️';
  return '📎';
}

function uploadAnexo(propostaId, tipo) {
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.onchange = async () => {
    const file = inp.files[0];
    if (!file) return;
    if (file.size > 25 * 1024 * 1024) {
      showToast('Ficheiro demasiado grande (máx 25 MB)', 'error');
      return;
    }
    showToast('A carregar ' + file.name + '...', '');
    const ext = file.name.split('.').pop();
    const path = propostaId + '/' + Date.now() + '_' + file.name.replace(/[^a-zA-Z0-9._-]/g, '_');

    const { error: upErr } = await sb.storage.from('inspect-anexos').upload(path, file, {
      contentType: file.type,
      upsert: false
    });
    if (upErr) { showToast('Erro upload: ' + upErr.message, 'error'); return; }

    const { error: dbErr } = await sb.from('inspect_anexos').insert({
      pedido_id: propostaId,
      tipo: tipo,
      nome: file.name,
      storage_path: path,
      tamanho_bytes: file.size,
      mime_type: file.type
    });
    if (dbErr) {
      await sb.storage.from('inspect-anexos').remove([path]);
      showToast('Erro BD: ' + dbErr.message, 'error');
      return;
    }
    showToast('Anexo carregado', 'success');
    openInspectDetail(propostaId);
  };
  inp.click();
}

async function downloadAnexo(path, nome) {
  const { data, error } = await sb.storage.from('inspect-anexos').createSignedUrl(path, 60);
  if (error) { showToast('Erro: ' + error.message, 'error'); return; }
  const a = document.createElement('a');
  a.href = data.signedUrl;
  a.download = nome;
  document.body.appendChild(a);
  a.click();
  a.remove();
}

function deleteAnexo(anexoId, path, propostaId) {
  confirmAction('Eliminar este anexo?', async () => {
    await sb.storage.from('inspect-anexos').remove([path]);
    const { error } = await sb.from('inspect_anexos').delete().eq('id', anexoId);
    if (error) { showToast('Erro: ' + error.message, 'error'); return; }
    showToast('Anexo eliminado', 'success');
    openInspectDetail(propostaId);
  });
}

function frotaCalcDerived(v) {
  // Devolve { duracaoAnos, kmsAno, kmsMes, mesesContrato }
  let duracaoAnos = null, kmsAno = null, kmsMes = null, mesesContrato = null;
  if (v.inicio_contrato && v.fim_contrato) {
    // Meses de calendário (evita desvios de anos bissextos com dias/365.25)
    const ini = new Date(v.inicio_contrato);
    const fim = new Date(v.fim_contrato);
    let meses = (fim.getFullYear() - ini.getFullYear()) * 12 + (fim.getMonth() - ini.getMonth());
    meses += (fim.getDate() - ini.getDate()) / 30.4375; // fração pelos dias restantes
    if (meses > 0) {
      mesesContrato = meses;
      duracaoAnos = meses / 12;
      if (v.kms_contratados) {
        kmsAno = v.kms_contratados / duracaoAnos;
        kmsMes = v.kms_contratados / mesesContrato;
      }
    }
  }
  return { duracaoAnos, kmsAno, kmsMes, mesesContrato };
}

function switchFrotaView(view) {
  state.frotaView = view;
  renderFrota();
}

function renderFrota() {
  if (state.frotaView === 'financeiro') { renderFrotaFinanceiro(); return; }
  if (state.frotaView === 'analise') { renderFrotaAnalise(); return; }
  if (state.frotaView === 'controlo') { renderFrotaControlo(); return; }
  renderFrotaListagem();
}

function frotaTabs(active) {
  return `
    <div class="tabs">
      <button class="tab-btn ${active==='listagem'?'active':''}" onclick="switchFrotaView('listagem')">Listagem</button>
      <button class="tab-btn ${active==='controlo'?'active':''}" onclick="switchFrotaView('controlo')">Controlo</button>
      <button class="tab-btn ${active==='financeiro'?'active':''}" onclick="switchFrotaView('financeiro')">Financeiro</button>
      <button class="tab-btn ${active==='analise'?'active':''}" onclick="switchFrotaView('analise')">Análise</button>
    </div>`;
}

function renderFrotaListagem() {
  const f = state.filters.frota;
  if (!state.sort.frota) state.sort.frota = { key: 'matricula', dir: 'asc' };
  const { key, dir } = state.sort.frota;

  let data = [...state.data.frota];
  if (f.search) {
    const q = f.search.toLowerCase();
    data = data.filter(v =>
      (v.matricula || '').toLowerCase().includes(q) ||
      (v.viatura || '').toLowerCase().includes(q) ||
      (v.utilizador || '').toLowerCase().includes(q) ||
      (v.empresa || '').toLowerCase().includes(q)
    );
  }
  if (f.tipo) data = data.filter(v => v.tipo === f.tipo);

  // Derivar duração para ordenar
  const enriched = data.map(v => {
    const d = frotaCalcDerived(v);
    return { ...v, _duracao_anos: d.duracaoAnos != null ? Math.round(d.duracaoAnos) : null };
  });

  enriched.sort((a, b) => {
    let va = a[key], vb = b[key];
    if (va == null) return 1;
    if (vb == null) return -1;
    if (typeof va === 'string') { va = va.toLowerCase(); vb = (vb||'').toLowerCase(); }
    if (va < vb) return dir === 'asc' ? -1 : 1;
    if (va > vb) return dir === 'asc' ? 1 : -1;
    return 0;
  });

  const arrow = (k) => key === k ? (dir === 'asc' ? ' ▲' : ' ▼') : '';

  $('#section-frota').innerHTML = `
    <div class="page-header">
      <div>
        <div class="page-title">Frota</div>
        <div class="page-subtitle">${enriched.length} viatura(s)</div>
      </div>
      <div class="page-actions">
        ${frotaTabs('listagem')}
        <button class="btn btn-secondary" onclick="exportFrota()">⬇ Export XLSX</button>
        ${canEdit() ? `<button class="btn btn-gold" onclick="openFrotaModal()">+ Nova Viatura</button>` : ''}
        ${isAdmin() ? `<button class="btn btn-ghost btn-sm" style="color:var(--danger)" onclick="deleteAllRows('frota','Frota','frota')" title="Apagar tudo">🗑 Apagar tudo</button>` : ''}
      </div>
    </div>

    <div class="card">
      <div class="filter-bar">
        <input type="text" class="form-control search" id="frota-search" placeholder="Pesquisar matrícula, viatura, empresa, utilizador..."
               value="${escapeHtml(f.search)}" oninput="state.filters.frota.search = this.value; renderFrotaPreserveFocus();">
        <select class="form-control" onchange="state.filters.frota.tipo = this.value; renderFrota();">
          <option value="" ${f.tipo===''?'selected':''}>Todos os tipos</option>
          <option value="Própria" ${f.tipo==='Própria'?'selected':''}>Própria</option>
          <option value="Leasing" ${f.tipo==='Leasing'?'selected':''}>Leasing</option>
          <option value="Renting" ${f.tipo==='Renting'?'selected':''}>Renting</option>
        </select>
        <button class="btn btn-ghost btn-sm" onclick="state.filters.frota={search:'',tipo:''};renderFrota();">Limpar</button>
      </div>
      <div class="table-wrapper">
        <table class="data-table sortable-listing">
          <thead>
            <tr>
              <th class="sortable" onclick="sortFrota('matricula')">Matrícula${arrow('matricula')}</th>
              <th class="sortable" onclick="sortFrota('viatura')">Viatura${arrow('viatura')}</th>
              <th class="sortable" onclick="sortFrota('tipo')">Tipo${arrow('tipo')}</th>
              <th class="sortable" onclick="sortFrota('empresa')">Empresa${arrow('empresa')}</th>
              <th class="sortable" onclick="sortFrota('inicio_contrato')">Início Contrato${arrow('inicio_contrato')}</th>
              <th class="sortable" onclick="sortFrota('_duracao_anos')">Duração${arrow('_duracao_anos')}</th>
              <th class="sortable" onclick="sortFrota('fim_contrato')">Fim Contrato${arrow('fim_contrato')}</th>
              <th class="sortable num" onclick="sortFrota('mensalidade')">Mensalidade${arrow('mensalidade')}</th>
              <th class="sortable num" onclick="sortFrota('mensalidade_gps')">GPS${arrow('mensalidade_gps')}</th>
              <th class="sortable num" onclick="sortFrota('seguro_valor')">Seguro${arrow('seguro_valor')}</th>
              <th class="sortable" onclick="sortFrota('seguro_periodicidade')">Periodicidade${arrow('seguro_periodicidade')}</th>
              <th class="sortable num" onclick="sortFrota('valor_km_mais')">Km +${arrow('valor_km_mais')}</th>
              <th class="sortable num" onclick="sortFrota('valor_km_menos')">Km −${arrow('valor_km_menos')}</th>
              <th class="sortable" onclick="sortFrota('utilizador')">Utilizador${arrow('utilizador')}</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            ${enriched.length === 0
              ? `<tr class="empty-row"><td colspan="15">Sem viaturas</td></tr>`
              : enriched.map(v => {
                const isContrato = v.tipo === 'Leasing' || v.tipo === 'Renting';
                const dur = v._duracao_anos != null ? v._duracao_anos + ' ano' + (v._duracao_anos===1?'':'s') : '—';
                return `
                <tr class="clickable" onclick="openFrotaFicha('${v.id}')">
                  <td class="cen"><strong>${escapeHtml(v.matricula)}</strong></td>
                  <td>${escapeHtml(v.viatura)}</td>
                  <td class="cen">${escapeHtml(v.tipo)}</td>
                  <td>${isContrato ? escapeHtml(v.empresa) : '—'}</td>
                  <td class="cen">${isContrato ? fmtDate(v.inicio_contrato) : '—'}</td>
                  <td class="cen">${isContrato ? dur : '—'}</td>
                  <td class="cen">${isContrato ? fmtDate(v.fim_contrato) : '—'}</td>
                  <td class="num">${isContrato ? fmtCurrency(v.mensalidade) : '—'}</td>
                  <td class="num">${isContrato ? fmtCurrency(v.mensalidade_gps) : '—'}</td>
                  <td class="num">${fmtCurrency(v.seguro_valor)}</td>
                  <td>${escapeHtml(v.seguro_periodicidade) || '—'}</td>
                  <td class="num">${isContrato ? fmtCurrency(v.valor_km_mais) : '—'}</td>
                  <td class="num">${isContrato ? fmtCurrency(v.valor_km_menos) : '—'}</td>
                  <td>${escapeHtml(v.utilizador)}</td>
                  <td onclick="event.stopPropagation()">
                    <div class="actions">
                      ${canEdit() ? `<button class="btn btn-ghost btn-sm" onclick="openFrotaModal('${v.id}')" title="Editar">✎</button>` : ''}
                      ${isAdmin() ? `<button class="btn btn-ghost btn-sm" style="color:var(--danger)" onclick="deleteFrota('${v.id}')" title="Eliminar">🗑</button>` : ''}
                    </div>
                  </td>
                </tr>`;
              }).join('')}
          </tbody>
        </table>
      </div>
    </div>
  `;
}

function sortFrota(k) {
  if (!state.sort.frota) state.sort.frota = { key: 'matricula', dir: 'asc' };
  if (state.sort.frota.key === k) state.sort.frota.dir = state.sort.frota.dir === 'asc' ? 'desc' : 'asc';
  else { state.sort.frota.key = k; state.sort.frota.dir = 'asc'; }
  renderFrota();
}

// Vista global de todos os controlos de kms
function renderFrotaControlo() {
  if (!state.filters.frotaControlos) state.filters.frotaControlos = { search: '', viatura: '' };
  const f = state.filters.frotaControlos;

  const vmap = {};
  state.data.frota.forEach(v => vmap[v.id] = v);

  let controlos = state.data.frotaControlos.map(c => ({
    ...c,
    matricula: vmap[c.viatura_id]?.matricula || '',
    viatura: vmap[c.viatura_id]?.viatura || '',
    utilizador: vmap[c.viatura_id]?.utilizador || ''
  }));

  if (f.search) {
    const q = f.search.toLowerCase();
    controlos = controlos.filter(c =>
      (c.matricula || '').toLowerCase().includes(q) ||
      (c.viatura || '').toLowerCase().includes(q) ||
      (c.utilizador || '').toLowerCase().includes(q)
    );
  }
  if (f.viatura) controlos = controlos.filter(c => c.viatura_id === f.viatura);

  // ordenar por data desc
  controlos.sort((a, b) => new Date(b.data_controlo) - new Date(a.data_controlo));

  $('#section-frota').innerHTML = `
    <div class="page-header">
      <div>
        <div class="page-title">Frota — Controlo de Kms</div>
        <div class="page-subtitle">${controlos.length} controlo(s)</div>
      </div>
      <div class="page-actions">
        ${frotaTabs('controlo')}
        ${canEdit() ? `<button class="btn btn-gold" onclick="openControloModal(null, true)">+ Novo Controlo</button>` : ''}
      </div>
    </div>

    <div class="card">
      <div class="filter-bar">
        <input type="text" class="form-control search" id="ctrl-search" placeholder="Pesquisar matrícula, viatura, utilizador..."
               value="${escapeHtml(f.search)}" oninput="state.filters.frotaControlos.search = this.value; renderFrotaControloPreserveFocus();">
        <select class="form-control" onchange="state.filters.frotaControlos.viatura = this.value; renderFrota();">
          <option value="">Todas as viaturas</option>
          ${state.data.frota.map(v => `<option value="${v.id}" ${f.viatura===v.id?'selected':''}>${escapeHtml(v.matricula)} — ${escapeHtml(v.viatura)}</option>`).join('')}
        </select>
        <button class="btn btn-ghost btn-sm" onclick="state.filters.frotaControlos={search:'',viatura:''};renderFrota();">Limpar</button>
      </div>
      <div class="table-wrapper">
        <table class="data-table">
          <thead>
            <tr>
              <th class="cen">Data</th>
              <th class="cen">Matrícula</th>
              <th>Viatura</th>
              <th>Utilizador</th>
              <th class="num">Kms atuais</th>
              <th class="num">Kms previstos</th>
              <th class="num">Desvio</th>
              <th class="num">Custo momento</th>
              <th class="num">Kms fim (est.)</th>
              <th class="num">Custo fim (est.)</th>
              ${isAdmin() ? '<th></th>' : ''}
            </tr>
          </thead>
          <tbody>
            ${controlos.length === 0
              ? `<tr class="empty-row"><td colspan="${isAdmin()?11:10}">Sem controlos registados</td></tr>`
              : controlos.map(c => `
                <tr class="clickable" onclick="openFrotaDetail('${c.viatura_id}')">
                  <td class="cen">${fmtDate(c.data_controlo)}</td>
                  <td class="cen"><strong>${escapeHtml(c.matricula)}</strong></td>
                  <td>${escapeHtml(c.viatura)}</td>
                  <td>${escapeHtml(c.utilizador)}</td>
                  <td class="num">${fmtNumber(c.kms_atuais)}</td>
                  <td class="num">${fmtNumber(c.kms_previstos)}</td>
                  <td class="num" style="color:${c.desvio > 0 ? 'var(--danger)' : 'var(--success)'};font-weight:600">${fmtNumber(c.desvio, true)}</td>
                  <td class="num">${fmtCurrency(c.custo_momento)}</td>
                  <td class="num">${fmtNumber(c.kms_extrapolados)}</td>
                  <td class="num" style="color:${c.custo_extrapolado > 0 ? 'var(--danger)' : 'var(--success)'};font-weight:600">${fmtCurrency(c.custo_extrapolado)}</td>
                  ${isAdmin() ? `<td onclick="event.stopPropagation()"><button class="btn btn-ghost btn-sm" style="color:var(--danger)" onclick="deleteControlo('${c.id}','${c.viatura_id}')">🗑</button></td>` : ''}
                </tr>
              `).join('')}
          </tbody>
        </table>
      </div>
    </div>
  `;
}

function renderFrotaControloPreserveFocus() {
  const el = document.activeElement;
  const isSearch = el && el.id === 'ctrl-search';
  const pos = isSearch ? el.selectionStart : null;
  renderFrota();
  if (isSearch) {
    const newEl = document.getElementById('ctrl-search');
    if (newEl) { newEl.focus(); if (pos !== null) newEl.setSelectionRange(pos, pos); }
  }
}

function renderFrotaPreserveFocus() {
  const el = document.activeElement;
  const isSearch = el && el.id === 'frota-search';
  const pos = isSearch ? el.selectionStart : null;
  renderFrota();
  if (isSearch) {
    const newEl = document.getElementById('frota-search');
    if (newEl) { newEl.focus(); if (pos !== null) newEl.setSelectionRange(pos, pos); }
  }
}

function sizeFrotaFormPanes() {
  // Mede o painel mais alto e fixa a mesma altura mínima em todos,
  // para o modal não mudar de tamanho ao trocar de tab
  const panes = document.querySelectorAll('.frota-form-pane');
  let max = 0;
  panes.forEach(p => {
    const prev = p.style.display;
    p.style.display = 'block';
    max = Math.max(max, p.offsetHeight);
    p.style.display = prev;
  });
  panes.forEach(p => p.style.minHeight = max + 'px');
}

function updateFrotaCalc() {
  const form = $('#form-frota');
  if (!form) return;
  const ini = form.inicio_contrato?.value;
  const fim = form.fim_contrato?.value;
  const kms = parseNumPT(form.kms_contratados?.value);
  const d = frotaCalcDerived({ inicio_contrato: ini, fim_contrato: fim, kms_contratados: kms });
  const durEl = $('#frota-duracao'), anoEl = $('#frota-kmsano'), mesEl = $('#frota-kmsmes');
  if (durEl) {
    if (d.duracaoAnos) {
      // Inteiro sem casas decimais ("5 anos"); caso contrário 1 casa com vírgula ("4,5 anos")
      const inteiro = Math.abs(d.duracaoAnos - Math.round(d.duracaoAnos)) < 0.05;
      const anosStr = inteiro ? String(Math.round(d.duracaoAnos)) : d.duracaoAnos.toFixed(1).replace('.', ',');
      durEl.value = anosStr + ' ' + (anosStr === '1' ? 'ano' : 'anos') + ' (' + Math.round(d.mesesContrato) + ' meses)';
    } else durEl.value = '—';
  }
  if (anoEl) anoEl.value = d.kmsAno ? fmtNumber(d.kmsAno) + ' km' : '—';
  if (mesEl) mesEl.value = d.kmsMes ? fmtNumber(d.kmsMes) + ' km' : '—';
}

async function saveFrota(id) {
  const form = $('#form-frota');
  const fileInput = form.elements['contrato_file'];
  const file = fileInput && fileInput.files && fileInput.files[0] ? fileInput.files[0] : null;

  const rec = {};
  new FormData(form).forEach((val, key) => {
    if (key === 'contrato_file') return; // tratado à parte
    rec[key] = val === '' ? null : val;
  });
  if (!rec.matricula) { showToast('Matrícula obrigatória', 'error'); return; }

  ['kms_contratados','valor_km_mais','valor_km_menos','mensalidade','mensalidade_gps','seguro_valor'].forEach(k => {
    if (rec[k]) { const n = parseNumPT(rec[k]); rec[k] = isNaN(n) ? null : n; }
  });

  // Se própria, limpa campos de contrato
  if (rec.tipo === 'Própria') {
    ['empresa','inicio_contrato','fim_contrato','kms_contratados','valor_km_mais','valor_km_menos','mensalidade','mensalidade_gps'].forEach(k => rec[k] = null);
  }

  // Insert/Update da viatura (sem o anexo ainda)
  let row;
  if (id) {
    const { data, error } = await sb.from('frota').update(rec).eq('id', id).select().single();
    if (error) { showToast('Erro: ' + error.message, 'error'); return; }
    row = data;
  } else {
    const { data, error } = await sb.from('frota').insert(rec).select().single();
    if (error) { showToast('Erro: ' + error.message, 'error'); return; }
    row = data;
  }

  // Upload do contrato (se houver ficheiro)
  if (file && row) {
    // Apagar anterior se existir
    if (row.contrato_storage_path) {
      await sb.storage.from('frota-anexos').remove([row.contrato_storage_path]);
    }
    const safeName = file.name.replace(/[^a-zA-Z0-9.\-_]/g, '_');
    const path = `${row.id}/contrato_${Date.now()}_${safeName}`;
    const { error: upErr } = await sb.storage.from('frota-anexos').upload(path, file, { upsert: true });
    if (upErr) { showToast('Erro ao enviar contrato: ' + upErr.message, 'error'); }
    else {
      await sb.from('frota').update({
        contrato_storage_path: path,
        contrato_nome: file.name,
        contrato_tamanho_bytes: file.size,
        contrato_mime_type: file.type || null
      }).eq('id', row.id);
    }
  }

  closeModal();
  await reloadTable('frota');
  renderFrota();
  showToast(id ? 'Viatura atualizada' : 'Viatura criada', 'success');
}

async function downloadFrotaContrato(id) {
  const v = state.data.frota.find(x => x.id === id);
  if (!v || !v.contrato_storage_path) return;
  const { data, error } = await sb.storage.from('frota-anexos').createSignedUrl(v.contrato_storage_path, 60);
  if (error) { showToast('Erro: ' + error.message, 'error'); return; }
  window.open(data.signedUrl, '_blank');
}

async function removerFrotaContrato(id) {
  if (!confirm('Remover o contrato anexado?')) return;
  const v = state.data.frota.find(x => x.id === id);
  if (!v) return;
  if (v.contrato_storage_path) {
    await sb.storage.from('frota-anexos').remove([v.contrato_storage_path]);
  }
  const { error } = await sb.from('frota').update({
    contrato_storage_path: null,
    contrato_nome: null,
    contrato_tamanho_bytes: null,
    contrato_mime_type: null

// Calcula métricas de um controlo de kms
function computeControlo(v, dataControlo, kmsAtuais) {
  if (!v.inicio_contrato || !v.fim_contrato || !v.kms_contratados || isNaN(kmsAtuais)) return null;
  const ini = new Date(v.inicio_contrato);
  const fim = new Date(v.fim_contrato);
  const dataCtrl = new Date(dataControlo);

  const totalDias = (fim - ini) / (1000*60*60*24);
  const decorridoDias = (dataCtrl - ini) / (1000*60*60*24);
  if (decorridoDias <= 0 || totalDias <= 0) return null;

  // Kms previstos proporcional ao tempo decorrido
  const kms_previstos = v.kms_contratados * (decorridoDias / totalDias);
  const desvio = kmsAtuais - kms_previstos;

  // Custo no momento: desvio positivo usa km+, negativo usa km-
  const taxaMomento = desvio > 0 ? (v.valor_km_mais || 0) : (v.valor_km_menos || 0);
  const custo_momento = desvio * taxaMomento;

  // Extrapolação (regra de 3): se em decorridoDias fez kmsAtuais, em totalDias faz...
  const kms_extrapolados = kmsAtuais * (totalDias / decorridoDias);
  const desvioFim = kms_extrapolados - v.kms_contratados;
  const taxaFim = desvioFim > 0 ? (v.valor_km_mais || 0) : (v.valor_km_menos || 0);
  const custo_extrapolado = desvioFim * taxaFim;

  return { kms_previstos, desvio, custo_momento, kms_extrapolados, custo_extrapolado };
}

            <label>Tipo</label>
            <select class="form-control" name="tipo">
              ${FROTA_TIPOS_DESPESA.map(t => `<option ${d.tipo===t?'selected':''}>${t}</option>`).join('')}
            </select>
          </div>
        </div>
        <div class="form-group">
          <label>Valor (€) <span class="required">*</span></label>
          <input type="number" step="0.01" class="form-control" name="valor" value="${d.valor ?? ''}">
        </div>
        <div class="form-group">
          <label>Notas</label>
          <input class="form-control" name="notas" value="${escapeHtml(d.notas)}">
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="saveDespesa('${id || ''}')">${id ? 'Atualizar' : 'Criar'}</button>
    </div>
  `, 'sm');
}

async function saveDespesa(id) {
  const form = $('#form-despesa');
  const rec = {};
  new FormData(form).forEach((val, key) => { rec[key] = val === '' ? null : val; });
  if (!rec.viatura_id) { showToast('Seleciona a viatura', 'error'); return; }
  if (!rec.data) { showToast('Data obrigatória', 'error'); return; }
  if (!rec.valor) { showToast('Valor obrigatório', 'error'); return; }
  rec.valor = parseFloat(rec.valor);

  const { error } = id
    ? await sb.from('frota_despesas').update(rec).eq('id', id)
    : await sb.from('frota_despesas').insert(rec);
  if (error) { showToast('Erro: ' + error.message, 'error'); return; }
  closeModal();
  await reloadTable('frotaDespesas');
  renderFrota();
  showToast(id ? 'Despesa atualizada' : 'Despesa criada', 'success');
}

async function deleteDespesa(id) {
  if (!confirm('Eliminar esta despesa?')) return;
  const { error } = await sb.from('frota_despesas').delete().eq('id', id);
  if (error) { showToast('Erro: ' + error.message, 'error'); return; }
  await reloadTable('frotaDespesas');
  renderFrota();
  showToast('Despesa eliminada', 'success');
}

function renderFrotaAnalise() {
  const viaturas = state.data.frota;
  const desp = state.data.frotaDespesas;
  const controlos = state.data.frotaControlos;

  // Custos fixos mensais (mensalidade + GPS) das viaturas em contrato
  const custoMensalFixo = viaturas.reduce((s, v) =>
    s + (Number(v.mensalidade) || 0) + (Number(v.mensalidade_gps) || 0), 0);

  // Total de despesas
  const totalDespesas = desp.reduce((s, d) => s + (Number(d.valor) || 0), 0);

  // Despesas por tipo
  const porTipo = {};
  desp.forEach(d => {
    const t = d.tipo || 'Outro';
    porTipo[t] = (porTipo[t] || 0) + (Number(d.valor) || 0);
  });

  // Despesas por viatura
  const vmap = {};
  viaturas.forEach(v => vmap[v.id] = v);
  const porViatura = {};
  desp.forEach(d => {
    const key = d.viatura_id;
    porViatura[key] = (porViatura[key] || 0) + (Number(d.valor) || 0);
  });

  // Último controlo por viatura — risco de penalização
  const ultimoControlo = {};
  controlos.forEach(c => {
    if (!ultimoControlo[c.viatura_id] || new Date(c.data_controlo) > new Date(ultimoControlo[c.viatura_id].data_controlo)) {
      ultimoControlo[c.viatura_id] = c;
    }
  });
  const riscoPenalizacao = Object.values(ultimoControlo).reduce((s, c) => s + (Number(c.custo_extrapolado) > 0 ? Number(c.custo_extrapolado) : 0), 0);

  $('#section-frota').innerHTML = `
    <div class="page-header">
      <div>
        <div class="page-title">Frota — Análise</div>
        <div class="page-subtitle">${viaturas.length} viaturas</div>
      </div>
      <div class="page-actions">
        ${frotaTabs('analise')}
      </div>
    </div>

    <div class="kpi-grid">
      <div class="kpi-card">
        <div class="kpi-label">Custo fixo mensal</div>
        <div class="kpi-value">${fmtCurrency(custoMensalFixo)}</div>
        <div class="kpi-sub">mensalidades + GPS</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Total despesas</div>
        <div class="kpi-value">${fmtCurrency(totalDespesas)}</div>
        <div class="kpi-sub">${desp.length} registos</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Risco penalização kms</div>
        <div class="kpi-value" style="color:${riscoPenalizacao > 0 ? 'var(--danger)' : 'var(--success)'}">${fmtCurrency(riscoPenalizacao)}</div>
        <div class="kpi-sub">projeção fim contratos</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Viaturas em contrato</div>
        <div class="kpi-value">${viaturas.filter(v => v.tipo !== 'Própria').length}</div>
        <div class="kpi-sub">leasing + renting</div>
      </div>
    </div>

    <div class="chart-grid">
      <div class="card">
        <h4>Despesas por tipo</h4>
        <canvas id="chart-frota-tipo" height="200"></canvas>
      </div>
      <div class="card">
        <h4>Despesas por viatura</h4>
        <canvas id="chart-frota-viatura" height="200"></canvas>
      </div>
    </div>

    <div class="card">
      <h4>Resumo por viatura</h4>
      <div class="table-wrapper">
        <table class="data-table">
          <thead>
            <tr>
              <th>Matrícula</th>
              <th>Tipo</th>
              <th class="num">Custo fixo/mês</th>
              <th class="num">Despesas acumuladas</th>
              <th class="num">Custo fim contrato (est.)</th>
            </tr>
          </thead>
          <tbody>
            ${viaturas.map(v => {
              const uc = ultimoControlo[v.id];
              return `
              <tr>
                <td><strong>${escapeHtml(v.matricula)}</strong></td>
                <td>${escapeHtml(v.tipo)}</td>
                <td class="num">${v.tipo !== 'Própria' ? fmtCurrency((Number(v.mensalidade)||0)+(Number(v.mensalidade_gps)||0)) : '—'}</td>
                <td class="num">${fmtCurrency(porViatura[v.id] || 0)}</td>
                <td class="num" style="${uc && uc.custo_extrapolado ? `color:${uc.custo_extrapolado>0?'var(--danger)':'var(--success)'}` : ''}">${uc ? fmtCurrency(uc.custo_extrapolado) : '—'}</td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>
    </div>
  `;

  // Gráficos
  const tipoLabels = Object.keys(porTipo);
  const tipoData = tipoLabels.map(t => porTipo[t]);
  if (state.charts.frotaTipo) state.charts.frotaTipo.destroy();
  if (tipoLabels.length) {
    state.charts.frotaTipo = new Chart($('#chart-frota-tipo'), {
      type: 'doughnut',
      data: { labels: tipoLabels, datasets: [{ data: tipoData, backgroundColor: ['#1a3a5c','#c9a24a','#0ea5e9','#f87171','#34d399','#a78bfa','#fb923c','#94a3b8'] }] },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'right' } } }
    });
  }

  const viatLabels = Object.keys(porViatura).map(id => vmap[id]?.matricula || '—');
  const viatData = Object.keys(porViatura).map(id => porViatura[id]);
  if (state.charts.frotaViatura) state.charts.frotaViatura.destroy();
  if (viatLabels.length) {
    state.charts.frotaViatura = new Chart($('#chart-frota-viatura'), {
      type: 'bar',
      data: { labels: viatLabels, datasets: [{ label: 'Despesas (€)', data: viatData, backgroundColor: '#1a3a5c' }] },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
    });
  }
}

function exportFrota() {
  exportXLSX(state.data.frota, [
    { key: 'matricula', label: 'Matrícula' },
    { key: 'viatura', label: 'Viatura' },
    { key: 'tipo', label: 'Tipo' },
    { key: 'empresa', label: 'Empresa' },
    { key: 'inicio_contrato', label: 'Início Contrato', format: fmtDate },
    { key: 'fim_contrato', label: 'Fim Contrato', format: fmtDate },
    { key: 'kms_contratados', label: 'Kms Contratados' },
    { key: 'valor_km_mais', label: 'Valor Km+ (€)' },
    { key: 'valor_km_menos', label: 'Valor Km- (€)' },
    { key: 'mensalidade', label: 'Mensalidade (€)' },
    { key: 'mensalidade_gps', label: 'Mensalidade GPS (€)' },
    { key: 'seguro_valor', label: 'Seguro (€)' },
    { key: 'seguro_periodicidade', label: 'Periodicidade Seguro' },
    { key: 'utilizador', label: 'Utilizador' },
    { key: 'observacoes', label: 'Observações' }
  ], 'siga_frota_' + new Date().toISOString().slice(0,10) + '.xlsx');
}

function exportFrotaDespesas() {
  const vmap = {};
  state.data.frota.forEach(v => vmap[v.id] = v);
  const rows = state.data.frotaDespesas.map(d => ({
    ...d,
    matricula: vmap[d.viatura_id]?.matricula || '',
    viatura_nome: vmap[d.viatura_id]?.viatura || ''
  }));
  exportXLSX(rows, [
    { key: 'data', label: 'Data', format: fmtDate },
    { key: 'matricula', label: 'Matrícula' },
    { key: 'viatura_nome', label: 'Viatura' },
    { key: 'tipo', label: 'Tipo' },
    { key: 'valor', label: 'Valor (€)' },
    { key: 'notas', label: 'Notas' }
  ], 'siga_frota_despesas_' + new Date().toISOString().slice(0,10) + '.xlsx');
}

    afetacoes: '📊',

    equipamentos: '🖥️',
    comunicacoes: '📞'
  };
  $('#section-' + key).innerHTML = `
    <div class="page-header">
      <div>
        <div class="page-title">${title}</div>
        <div class="page-subtitle">Em desenvolvimento</div>
      </div>
    </div>
    <div class="card">
      <div class="placeholder">
        <div class="icon">${iconMap[key] || '⚙️'}</div>
        <h3>${title}</h3>
        <p>${message}</p>
        <p class="text-small">Estrutura de base de dados já criada. Campos e UI a detalhar na próxima iteração.</p>
      </div>

  `;
}

async function startApp() {
  $('#login-screen').style.display = 'none';
  $('#app').classList.add('active');
  $('#user-name').textContent = state.userName;
  const badge = $('#user-badge');
  badge.textContent = state.userRole;
  badge.className = 'user-badge ' + state.userRole;

  initEmailJS();
  await loadAll();
  navigate('dashboard');
}

$$('.nav-link').forEach(btn => {
  btn.onclick = () => navigate(btn.dataset.section);
});
$('#logout-btn').onclick = logout;
$('#login-btn').onclick = login;
$('#login-password').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
$('#login-email').addEventListener('keydown', e => { if (e.key === 'Enter') $('#login-password').focus(); });

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
});

// Modal overlay: fecha só em mousedown DIRETO no overlay (não em clicks "fantasma")
// Usar mousedown em vez de click evita closing acidental quando o utilizador
// arrasta selecção de texto e solta fora do modal.
$('#modal-overlay').addEventListener('mousedown', e => {
  if (e.target === e.currentTarget) closeModal();
});

// Evita que Backspace num campo vazio faça "history back" em alguns browsers
document.addEventListener('keydown', e => {
  if (e.key !== 'Backspace') return;
  const t = e.target;
  if (!t || t.tagName !== 'INPUT' && t.tagName !== 'TEXTAREA') {
    // Backspace fora de input — pode causar history.back
    if (document.querySelector('#modal-overlay.active')) e.preventDefault();
  }
});

// Boot
(async () => {
  const ok = await checkAuth();
  if (ok) await startApp();
})();

</script>
